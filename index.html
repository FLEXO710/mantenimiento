/* ══════════════ PARTE DE TRABAJO ══════════════ */
let CHRONO = null;
function chronoMs(){ const d=state.draft; if(!d||!d.t0) return 0; return d.acc + (d.paused?0:(Date.now()-d.t0)); }
function chronoMin(){ return Math.max(1, Math.round(chronoMs()/60000)); }
function fmtChrono(ms){ const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),q=s%60;
  return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(q).padStart(2,"0"); }
function tickChrono(){ const n=document.getElementById("chrono"); if(n) n.textContent=fmtChrono(chronoMs()); }
function stopChrono(){ if(CHRONO){ clearInterval(CHRONO); CHRONO=null; } }
function chronoChip(){
  const d=state.draft; if(!d||!d.t0) return "";
  return `<div style="display:flex;align-items:center;gap:8px;flex:none">
    <span class="pill ${d.paused?"warn":"ok"}" style="font-family:var(--fm);font-size:13px;padding:5px 11px"><i></i><span id="chrono">${fmtChrono(chronoMs())}</span></span>
    <button class="btn ghost" data-pause style="padding:5px 9px;font-size:12.5px">${d.paused?"Reanudar":"Pausar"}</button></div>`;
}
function abrirParte(mid, tid){
  const m = byId(mid); if(!m) return;
  const t = (m.tareas||[]).find(x=>x.id===tid); if(!t) return;
  const needFotos = t.fotos !== "No hacen falta";
  const antes = t.fotos === "Antes y después";
  state.draft = {mid, tid, step:0, loto:false, marks:(t.checks||[]).map(()=>null), notes:{},
    vals:(t.medidas||[]).map(()=>""), before:null, after:null, obs:"", prov:false, provQue:"",
    t0:Date.now(), acc:0, paused:false, manual:null, manualWhy:"", editTime:false, needFotos, antes,
    quien:((DB.personas||[])[2]||{}).n || "Mantenimiento"};
  if(!CHRONO) CHRONO = setInterval(tickChrono, 1000);
  renderModal();
}
function sheetParte(){
  const d = state.draft, m = byId(d.mid), t = (m.tareas||[]).find(x=>x.id===d.tid);
  const pasos = ["Seguridad"]; if(d.antes) pasos.push("Foto de antes");
  pasos.push("Ejecución","Cierre");
  const N = pasos.length;
  const steps = `<div class="steps">${pasos.map((_,i)=>`<div class="${i<d.step?"done":i===d.step?"on":""}"></div>`).join("")}</div>`;
  const foto = (k,label,hint) => `<label class="photo ${d[k]?"filled":""}" style="aspect-ratio:3/2">
      ${d[k]?`<img src="${d[k]}" alt="${label}">`:`${ICON.camera}<span>${label}</span><span style="font-size:11.5px;font-weight:400;opacity:.8">${hint}</span>`}
      <span class="tag">${label.toUpperCase()}</span>
      <input type="file" accept="image/*" capture="environment" data-photo="${k}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>`;
  const paso = pasos[d.step];
  let content = "", footer = "";

  if(paso==="Seguridad"){
    const r = m.reglas || {};
    content = `
      ${r.loto?`<div class="note warn" style="margin-bottom:14px">${ICON.warn}<div><b>Antes de tocar nada.</b> Esta máquina exige consignación eléctrica: toda operación se hace con el suministro desconectado.</div></div>`:""}
      ${(r.avisos||[]).map(a=>`<div class="note warn" style="margin-bottom:14px">${ICON.warn}<div>${esc(a)}</div></div>`).join("")}
      ${r.epi?`<div class="note" style="margin-bottom:16px">${ICON.info}<div><b>EPI:</b> ${esc(r.epi)}</div></div>`:""}
      ${r.loto?`<label class="checkbig ${d.loto?"on":""}"><input type="checkbox" data-loto ${d.loto?"checked":""}>
        <span class="txt"><b>He desconectado el suministro eléctrico y consignado la máquina.</b><br><span style="color:var(--ink-2)">Queda registrado con tu nombre y la hora.</span></span></label>`:""}
      ${t.desc?`<div class="note" style="margin-top:16px">${ICON.info}<div>${esc(t.desc)}</div></div>`:""}
      <div class="summary" style="margin-top:16px">
        <div><span>Máquina</span><span>${esc(m.id)} · ${esc(m.nombre)}</span></div>
        <div><span>Frecuencia</span><span>${esc(freqTexto(t))}</span></div>
        <div><span>Tiempo estimado</span><span>${hm(t.min)}</span></div>
        <div><span>Cronómetro</span><span>En marcha desde que abriste el parte</span></div>
      </div>`;
    footer = `<button class="btn ghost" data-posponer>No se puede hacer</button><div class="spacer"></div>
      <button class="btn primary" data-next ${(!m.reglas||!m.reglas.loto||d.loto)?"":"disabled"}>Empezar</button>`;
  }

  if(paso==="Foto de antes"){
    content = `<div class="note warn" style="margin-bottom:16px">${ICON.warn}<div><b>Primero la foto, después el trabajo.</b> Hasta que no esté la foto del estado inicial no se abre la lista de comprobación.</div></div>
      ${foto("before","Antes","Estado de la máquina o la pieza tal y como la encuentras")}
      <div class="reqline">${ICON.info} Se comprime en la tablet antes de enviarse.</div>`;
    footer = `<button class="btn ghost" data-back>Atrás</button><div class="spacer"></div>
      <button class="btn primary" data-next ${d.before?"":"disabled"}>${d.before?"Continuar":"Falta la foto"}</button>`;
  }

  if(paso==="Ejecución"){
    const checks = t.checks || [];
    content = `
      <p class="sub" style="margin:0 0 14px">Marca cada punto. Si algo no está conforme, se te pedirá una nota.</p>
      <div class="chk">${checks.map((it,i)=>{
        const v = d.marks[i];
        return `<div class="chkitem"><div class="top">
            <span class="lbl">${esc(it)}</span>
            <span class="seg">
              <button data-mark="${i}" data-v="ok" class="${v==="ok"?"on-ok":""}">Conforme</button>
              <button data-mark="${i}" data-v="no" class="${v==="no"?"on-no":""}">No conf.</button>
              <button data-mark="${i}" data-v="na" class="${v==="na"?"on-na":""}">N/A</button>
            </span></div>
          ${v==="no"?`<div style="margin-top:10px"><textarea data-note="${i}" placeholder="¿Qué has encontrado?" style="min-height:56px">${esc(d.notes[i]||"")}</textarea></div>`:""}
        </div>`;}).join("") || `<p class="sub">Esta tarea no tiene puntos de comprobación definidos.</p>`}</div>
      ${(t.medidas||[]).length?`<div class="field" style="margin-top:20px"><label>Valores a registrar</label>
        <div class="linelist">${t.medidas.map((md,i)=>{
          const v = d.vals[i], num = parseFloat(String(v).replace(",","."));
          const fuera = v!=="" && !isNaN(num) && ((md.min!=null&&md.max!=null&&md.min!==md.max) && (num<md.min||num>md.max));
          return `<div class="lineitem"><span style="flex:2;min-width:130px;font-size:13.5px">${esc(md.n)}</span>
            <input type="number" step="any" data-val="${i}" value="${esc(v)}" placeholder="—" style="flex:1;min-width:80px;text-align:right">
            <span class="mono" style="font-size:12px;color:var(--ink-3);width:44px">${esc(md.u||"")}</span>
            ${(md.min!=null&&md.max!=null&&md.min!==md.max)?`<span class="pill ${fuera?"crit":v===""?"neut":"ok"}" style="min-width:96px"><i></i>${fuera?"Fuera de rango":`${md.min} – ${md.max}`}</span>`:""}
          </div>`;}).join("")}</div></div>`:""}`;
    const done = checks.every((_,i)=>d.marks[i]!==null);
    footer = `<button class="btn ghost" data-back>Atrás</button><div class="spacer"></div>
      <span class="sub mono" style="margin-right:6px">${d.marks.filter(v=>v!==null).length}/${checks.length}</span>
      <button class="btn primary" data-next ${done?"":"disabled"}>Continuar</button>`;
  }

  if(paso==="Cierre"){
    const auto = chronoMin(), mins = d.manual!==null ? d.manual : auto;
    const noConf = d.marks.filter(v=>v==="no").length;
    content = `
      ${d.needFotos?`${foto("after","Después","Cómo queda el equipo tras la intervención")}
        <div class="reqline" style="margin-bottom:18px">${ICON.info} La foto de después es obligatoria para firmar.</div>`:""}
      <div class="field"><label>Tiempo empleado</label>
        <div class="summary">
          <div><span>Medido por el cronómetro</span><span class="mono">${fmtChrono(chronoMs())} · ${auto} min</span></div>
          <div><span>Estimado por el plan</span><span class="mono">${t.min} min</span></div>
          ${d.manual!==null?`<div><span>Corregido a mano</span><span class="mono">${d.manual} min</span></div>`:""}
        </div>
        ${d.editTime?`<div class="rowsplit" style="margin-top:12px">
            <div style="flex:1;min-width:120px"><input type="number" id="mins" value="${mins}" min="1"></div>
            <div style="flex:2;min-width:180px"><input type="text" id="whymins" value="${esc(d.manualWhy)}" placeholder="¿Por qué corriges el tiempo?"></div>
          </div><div class="help" style="margin-top:8px">La corrección queda registrada con su motivo. El tiempo del cronómetro nunca se borra.</div>`
        :`<div style="margin-top:10px"><button class="linkish" data-edittime>Corregir el tiempo a mano</button></div>`}</div>
      <div class="field"><label for="obs">Observaciones</label>
        <textarea id="obs" placeholder="Lo que quieras dejar dicho para la próxima vez">${esc(d.obs)}</textarea></div>
      ${noConf?`<div class="note warn" style="margin-bottom:16px">${ICON.warn}<div><b>${noConf} punto${noConf>1?"s":""} no conforme${noConf>1?"s":""}.</b> Si lo has dejado funcionando con un apaño, márcalo abajo.</div></div>`:""}
      <label class="checkbig ${d.prov?"on":""}" style="border-color:${d.prov?"var(--warn-dot)":"var(--line-2)"};background:${d.prov?"var(--warn-bg)":"var(--surface)"}">
        <input type="checkbox" data-prov ${d.prov?"checked":""}>
        <span class="txt"><b>Lo he dejado con un arreglo provisional.</b><br><span style="color:var(--ink-2)">Funciona, pero no es la reparación definitiva. Queda marcado en el histórico hasta que se haga bien.</span></span></label>
      ${d.prov?`<div class="field" style="margin-top:14px"><label for="prq">¿Qué falta para la reparación definitiva?</label>
        <input type="text" id="prq" value="${esc(d.provQue)}" placeholder="p. ej. recibir la guía LLTHC"></div>`:""}
      <div class="field" style="margin-top:16px"><label for="quien">Firma</label>
        <select id="quien">${(DB.personas||[]).map(p=>`<option ${p.n===d.quien?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div>`;
    const okFoto = !d.needFotos || d.after;
    footer = `<button class="btn ghost" data-back>Atrás</button><div class="spacer"></div>
      <button class="btn primary" data-finish ${okFoto?"":"disabled"}>${okFoto?"Firmar y cerrar parte":"Falta la foto de después"}</button>`;
  }

  return sheetShell(t.nombre, `${esc(m.id)} · ${esc(m.nombre)} · ${paso} ${d.step+1}/${N}`, steps, content, footer, chronoChip());
}
function sheetPosponer(){
  const m = byId(state.draft.mid);
  return sheetShell("No se puede realizar", `${esc(m.id)} · ${esc(m.nombre)}`, "", `
    <div class="note" style="margin-bottom:16px">${ICON.info}<div>Posponer no es un fallo: es información. Si una tarea se pospone tres veces por producción, el problema es de planificación y conviene verlo.</div></div>
    <div class="field"><label for="mot">Motivo</label>
      <select id="mot"><option>Máquina en producción, no se puede parar</option><option>Falta repuesto</option><option>Falta tiempo en la jornada</option><option>Requiere técnico externo</option><option>Otro</option></select></div>
    <div class="field"><label for="nd">Aplazar hasta</label><input type="date" id="nd" value="${esc(toISO(addDays(today(),1)))}"></div>
    <div class="field"><label for="det">Detalle</label><textarea id="det" placeholder="Opcional"></textarea></div>
  `, `<button class="btn ghost" data-close>Cancelar</button><div class="spacer"></div><button class="btn primary" data-dopos>Posponer y avisar</button>`);
}

function sheetFotos(hid){
  const h = DB.historial.find(x=>x.id===hid); if(!h) return "";
  const m = byId(h.mid) || {nombre:h.mid};
  const cara = (k,l) => (h.fotos&&h.fotos[k])
    ? `<figure><img id="img_${k}" alt="${l}" src="" style="min-height:120px;background:var(--surface-2)"><figcaption>${l}</figcaption></figure>` : "";
  return sheetShell("Evidencias del parte", `${esc(h.mid)} · ${esc(fmtFull(parseISO(h.fecha)))}`, "", `
    <div class="summary" style="margin-bottom:16px">
      <div><span>Intervención</span><span>${esc(h.tarea)}</span></div>
      <div><span>Realizado por</span><span>${esc(h.por)} · ${esc(h.hora)}</span></div>
      <div><span>Tiempo</span><span class="mono">${h.min} min</span></div>
    </div>
    <div class="fotogrid">${cara("antes","Antes")}${cara("despues","Después")}</div>
    <div class="reqline" style="margin-top:12px">${ICON.info} Los enlaces caducan en una hora: las fotos no quedan expuestas en internet.</div>
  `, `<div class="spacer"></div><button class="btn" data-close>Cerrar</button>`);
}
function renderModal(){
  const root = $("#modalRoot");
  if(!state.modal && !state.draft && !state.td){ root.innerHTML=""; return; }
  if(state.modal && state.modal.indexOf("fotos:")===0){
    const hid = state.modal.slice(6);
    root.innerHTML = sheetFotos(hid); bindModal();
    const h = DB.historial.find(x=>x.id===hid);
    ["antes","despues"].forEach(async k => {
      if(!h || !h.fotos || !h.fotos[k]) return;
      const u = await firmarFoto(h.fotos[k]);
      const n = document.getElementById("img_"+k);
      if(n && u) n.src = u;
    });
    return;
  }
  if(state.modal==="posponer")   root.innerHTML = sheetPosponer();
  else if(state.modal==="averia")root.innerHTML = sheetAveria();
  else if(state.modal==="rep")   root.innerHTML = sheetRepuesto();
  else if(state.modal && state.modal.indexOf("vb:")===0) root.innerHTML = sheetVB(state.modal.slice(3));
  else if(state.td)              root.innerHTML = sheetTarea();
  else if(state.draft)           root.innerHTML = sheetParte();
  else { root.innerHTML=""; return; }
  bindModal();
}

/* ══════════════ EVENTOS DE MODAL ══════════════ */
function bindModal(){
  const root = $("#modalRoot"), q = s => root.querySelector(s);
  const on = (s,ev,fn) => root.querySelectorAll(s).forEach(n=>n.addEventListener(ev,fn));
  const close = () => { stopChrono(); state.modal=null; state.draft=null; state.td=null; renderModal(); };
  on("[data-close]","click",close);
  const scrim = root.querySelector("[data-scrim]");
  if(scrim) scrim.onclick = e => { if(e.target===scrim) close(); };
  document.onkeydown = e => { if(e.key==="Escape") close(); };

  /* ---- editor de tarea ---- */
  const td = state.td;
  if(td){
    on("[data-t]","input", e=>{ const k=e.target.dataset.t; td[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value; });
    on("[data-t]","change", e=>{ const k=e.target.dataset.t;
      td[k] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
      if(k==="parada"||k==="unidad") renderModal(); });
    on("[data-chk]","input", e=>{ td.checks[+e.target.dataset.chk] = e.target.value; });
    on("[data-delchk]","click", e=>{ td.checks.splice(+e.currentTarget.dataset.delchk,1); renderModal(); });
    on("[data-addchk]","click", ()=>{ td.checks.push(""); renderModal(); setTimeout(()=>{ const ns=root.querySelectorAll("[data-chk]"); if(ns.length) ns[ns.length-1].focus(); },0); });
    on("[data-med]","input", e=>{ const [i,f]=e.target.dataset.med.split("|"); const v=e.target.value;
      td.medidas[+i][f] = (f==="min"||f==="max") ? (v===""?null:parseFloat(v)) : v; });
    on("[data-delmed]","click", e=>{ td.medidas.splice(+e.currentTarget.dataset.delmed,1); renderModal(); });
    on("[data-addmed]","click", ()=>{ td.medidas.push({n:"",u:"",min:null,max:null}); renderModal(); });
    on("[data-savetask]","click", async ()=>{
      if(!td.nombre){ toast("Ponle nombre a la tarea."); return; }
      const m = byId(state.mid); if(!m) return;
      m.tareas = m.tareas || [];
      const clean = {id: td._id || uid(m.id), nombre:td.nombre, desc:td.desc||"",
        checks:(td.checks||[]).filter(c=>String(c).trim()), medidas:(td.medidas||[]).filter(x=>String(x.n).trim()),
        unidad:td.unidad, cada:Math.max(1,+td.cada||1), min:Math.max(1,+td.min||1),
        perfil:td.perfil, fotos:td.fotos, parada:!!td.parada, rep:td.rep||"", last:td.last||toISO(today())};
      if(td.cadaH) clean.cadaH = +td.cadaH;
      const i = m.tareas.findIndex(x=>x.id===clean.id);
      if(i>=0) m.tareas[i] = Object.assign({}, m.tareas[i], clean); else m.tareas.push(clean);
      state.td = null; renderModal(); render();
      await guardar(i>=0 ? "Tarea actualizada." : "Tarea añadida al plan.");
    });
    on("[data-deltask]","click", async ()=>{
      const m = byId(state.mid);
      m.tareas = (m.tareas||[]).filter(x=>x.id!==td._id);
      state.td=null; renderModal(); render(); await guardar("Tarea eliminada.");
    });
  }

  /* ---- repuesto ---- */
  on("[data-dorep]","click", async ()=>{
    const g = id => { const n=q("#"+id); return n?n.value:""; };
    if(!g("rname")){ toast("Falta la descripción."); return; }
    const m = byId(state.mid); m.repuestos = m.repuestos || [];
    m.repuestos.push({ref:g("rref"), name:g("rname"), stock:+g("rstock")||0, min:+g("rmin")||0,
      prov:g("rprov")||"—", plazo:+g("rplazo")||0, nota:g("rnota")||""});
    close(); render(); await guardar("Repuesto añadido.");
  });

  /* ---- avería ---- */
  on("[data-doav]","click", async ()=>{
    const g = id => { const n=q("#"+id); return n?n.value:""; };
    if(!g("ad")){ toast("Describe qué ha pasado."); return; }
    const d = today();
    const n = String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    const seq = String(DB.averias.filter(a=>String(a.id).startsWith(n)).length+1).padStart(2,"0");
    DB.averias.push({id:n+seq, mid:g("am"), desc:g("ad"), cons:g("ac"), abierta:true,
      fecha:toISO(d), sol:g("asol"), paro:+g("ap")||0, rep:+g("ar")||0});
    close(); render(); await guardar(`Solicitud ${n+seq} registrada.`);
  });

  /* ---- visto bueno ---- */
  root.querySelectorAll("[data-vbchk] input").forEach(i=>i.onchange=e=>{ e.target.closest(".checkbig").classList.toggle("on", e.target.checked); });
  on("[data-dovb]","click", async e=>{
    const h = DB.historial.find(x=>x.id===e.currentTarget.dataset.dovb);
    if(h){ h.vb = true; h.vbPor = (q("#vbq")||{}).value || ""; }
    close(); render(); await guardar("Máquina liberada para producción.");
  });

  /* ---- parte ---- */
  const d = state.draft;
  if(d){
    on("[data-loto]","change", e=>{ d.loto=e.target.checked; renderModal(); });
    on("[data-next]","click", ()=>{ d.step++; renderModal(); });
    on("[data-back]","click", ()=>{ d.step--; renderModal(); });
    on("[data-mark]","click", e=>{ d.marks[+e.currentTarget.dataset.mark]=e.currentTarget.dataset.v; renderModal(); });
    on("[data-note]","input", e=>{ d.notes[+e.target.dataset.note]=e.target.value; });
    on("[data-val]","input", e=>{ d.vals[+e.target.dataset.val]=e.target.value; });
    on("[data-val]","change", ()=>renderModal());
    on("[data-prov]","change", e=>{ d.prov=e.target.checked; renderModal(); });
    on("#prq","input", e=>{ d.provQue=e.target.value; });
    on("#obs","input", e=>{ d.obs=e.target.value; });
    on("#quien","change", e=>{ d.quien=e.target.value; });
    on("[data-posponer]","click", ()=>{ state.modal="posponer"; renderModal(); });
    on("[data-pause]","click", ()=>{ if(d.paused){ d.t0=Date.now(); d.paused=false; } else { d.acc+=Date.now()-d.t0; d.paused=true; } renderModal(); });
    on("[data-edittime]","click", ()=>{ d.editTime=true; d.manual=chronoMin(); renderModal(); });
    on("#mins","input", e=>{ d.manual=Math.max(1,parseInt(e.target.value||"1",10)); });
    on("#whymins","input", e=>{ d.manualWhy=e.target.value; });
    on("[data-photo]","change", e=>{
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const k = e.target.dataset.photo;
      const r = new FileReader(); r.onload = () => { d[k]=r.result; renderModal(); }; r.readAsDataURL(f);
    });
    on("[data-dopos]","click", async ()=>{
      const m = byId(d.mid), t = (m.tareas||[]).find(x=>x.id===d.tid);
      const nd = (q("#nd")||{}).value;
      if(t && nd){
        const dias = t.unidad==="Días laborables" ? 1 : t.unidad==="Semanas" ? 7*(+t.cada||1) : t.unidad==="Meses" ? Math.round(30.44*(+t.cada||1)) : 1;
        t.last = toISO(addDays(parseISO(nd), -dias));
      }
      close(); render(); await guardar("Tarea aplazada y avisado el encargado.");
    });
    on("[data-finish]","click", async e=>{
      const m = byId(d.mid), t = (m.tareas||[]).find(x=>x.id===d.tid);
      const real = d.manual!==null ? d.manual : chronoMin();
      const e0 = estadoTarea(m,t);
      const now = new Date();
      const hid = uid("H");
      const btn = e.currentTarget; btn.disabled = true; btn.textContent = "Subiendo fotos…";
      const fotos = {};
      if(d.before){ const r = await subirFoto(m.id+"/"+hid+"-antes.jpg", d.before);   if(r) fotos.antes = r; }
      if(d.after){  const r = await subirFoto(m.id+"/"+hid+"-despues.jpg", d.after);  if(r) fotos.despues = r; }
      if((d.before && !fotos.antes) || (d.after && !fotos.despues)){
        btn.disabled = false; btn.textContent = "Firmar y cerrar parte";
        toast("No se han podido subir las fotos. Comprueba la conexión y vuelve a intentarlo.");
        return;
      }
      DB.historial.push({id: hid, fotos: fotos, mid:m.id, tid:t.id, tarea:t.nombre, fecha:toISO(today()),
        hora: String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),
        por: d.quien, min: real, minAuto: chronoMin(), motivo: d.manualWhy||"",
        obs: d.obs||"", prov: !!d.prov, provQue: d.provQue||"",
        noConf: d.marks.filter(v=>v==="no").length,
        vals: (t.medidas||[]).map((md,i)=>({n:md.n, v:d.vals[i]})),
        tarde: e0.d < 0, needVB: !!(m.reglas&&m.reglas.vb), vb: !(m.reglas&&m.reglas.vb)});
      t.last = toISO(today());
      if(t.unidad==="Horas de trabajo" || t.cadaH) t.lastH = horasAcum(m);
      close(); render();
      await guardar(d.prov ? `Parte cerrado en ${real} min. Queda marcado como arreglo provisional.` : `Parte cerrado en ${real} min.`);
    });
  }
}

/* ══════════════ EVENTOS DE VISTA ══════════════ */
function bindView(){
  const v = $("#view");
  const on = (s,fn) => v.querySelectorAll(s).forEach(n=>n.addEventListener("click",fn));

  v.querySelectorAll("[data-aj]").forEach(n=>n.addEventListener("change", e=>{
    ajustes()[e.target.dataset.aj] = +e.target.value || 0;
  }));
  on("[data-saveaj]", async ()=>{ render(); await guardar("Tarifas guardadas. El coste ya se calcula solo."); });
  on("[data-export]", async ()=>{
    try{
      const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "mantenimiento-dordiv-"+toISO(today())+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast("Copia de seguridad descargada.");
    }catch(e){ toast("No se ha podido preparar la descarga."); }
  });
  on("[data-nav]", e=>{ const t=e.currentTarget.dataset.nav; if(t==="alta") altaInit(); state.view=t; render(); });
  on("[data-mach]", e=>{ state.mid=e.currentTarget.dataset.mach; state.view="maquina"; state.tab="plan"; render(); });
  on("[data-tab]", e=>{ state.tab=e.currentTarget.dataset.tab; render(); });
  on("[data-open]", e=>{
    if(RO()){ toast("Vista de solo lectura."); return; }
    const [mid,tid] = e.currentTarget.dataset.open.split("|"); abrirParte(mid,tid);
  });
  on("[data-vb]", e=>{ state.modal="vb:"+e.currentTarget.dataset.vb; renderModal(); });
  on("[data-fotos]", e=>{ state.modal="fotos:"+e.currentTarget.dataset.fotos; renderModal(); });
  on('[data-act="averia"]', ()=>{ state.modal="averia"; renderModal(); });
  on("[data-addpart]", ()=>{ state.modal="rep"; renderModal(); });
  v.querySelectorAll("[data-pf]").forEach(n=>n.addEventListener("change", e=>{
    const [i,f] = e.target.dataset.pf.split("|");
    const m = byId(state.mid); if(m && m.repuestos[+i]) m.repuestos[+i][f] = +e.target.value || 0;
  }));
  on("[data-savepart]", async ()=>{ render(); await guardar("Stock actualizado."); });
  on("[data-irmaq]", e=>{ e.stopPropagation(); state.mid=e.currentTarget.dataset.irmaq; state.view="maquina"; state.tab="repuestos"; render(); });
  on("[data-togglerep]", e=>{
    const id = e.currentTarget.dataset.togglerep;
    state.repAbierto[id] = !state.repAbierto[id];
    render();
  });
  v.querySelectorAll("[data-togglerep]").forEach(n=>n.addEventListener("keydown", e=>{
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); n.click(); }
  }));
  on("[data-repall]", e=>{
    const abrir = e.currentTarget.dataset.repall === "1";
    DB.maquinas.forEach(m=>{ if((m.repuestos||[]).length) state.repAbierto[m.id] = abrir; });
    render();
  });
  on("[data-delpart]", async e=>{
    const m=byId(state.mid); m.repuestos.splice(+e.currentTarget.dataset.delpart,1); render(); await guardar("Repuesto eliminado.");
  });
  on("[data-newtask]", ()=>{
    state.td = {_id:null, nombre:"", desc:"", checks:[""], medidas:[], unidad:"Semanas", cada:1, cadaH:"",
      min:20, perfil:"Mantenimiento", fotos:"Antes y después", parada:true, rep:"", last:toISO(today())};
    renderModal();
  });
  on("[data-edittask]", e=>{
    const m=byId(state.mid), t=(m.tareas||[]).find(x=>x.id===e.currentTarget.dataset.edittask);
    if(!t) return;
    state.td = Object.assign({}, t, {_id:t.id, checks:(t.checks||[]).slice(),
      medidas:(t.medidas||[]).map(x=>Object.assign({},x)), cadaH:t.cadaH||""});
    renderModal();
  });
  on("[data-closeav]", async e=>{
    const a=DB.averias.find(x=>x.id===e.currentTarget.dataset.closeav); if(a) a.abierta=false;
    render(); await guardar("Parte cerrado.");
  });

  /* ficha */
  on("[data-savemach]", async ()=>{
    const m = byId(state.mid); const old = m.id;
    v.querySelectorAll("[data-m]").forEach(n=>{ m[n.dataset.m] = n.value; });
    if(m.id !== old){ DB.historial.forEach(h=>{ if(h.mid===old) h.mid=m.id; }); DB.averias.forEach(a=>{ if(a.mid===old) a.mid=m.id; }); state.mid=m.id; }
    render(); await guardar("Ficha guardada.");
  });
  on("[data-delmach]", async ()=>{
    const m = byId(state.mid);
    if(!confirm(`¿Eliminar ${m.id} — ${m.nombre} y todo su plan? No se puede deshacer.`)) return;
    DB.maquinas = DB.maquinas.filter(x=>x.id!==m.id);
    state.view="maquinas"; render(); await guardar("Máquina eliminada.");
  });

  /* reglas */
  v.querySelectorAll("[data-r]").forEach(n=>n.addEventListener("change", e=>{
    const m=byId(state.mid); m.reglas = m.reglas||{};
    m.reglas[e.target.dataset.r] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
    const w=e.target.closest(".checkbig"); if(w) w.classList.toggle("on", e.target.checked);
  }));
  v.querySelectorAll("[data-aviso]").forEach(n=>n.addEventListener("input", e=>{
    byId(state.mid).reglas.avisos[+e.target.dataset.aviso] = e.target.value;
  }));
  on("[data-addaviso]", ()=>{ const m=byId(state.mid); m.reglas.avisos=m.reglas.avisos||[]; m.reglas.avisos.push(""); render(); });
  on("[data-delaviso]", e=>{ byId(state.mid).reglas.avisos.splice(+e.currentTarget.dataset.delaviso,1); render(); });
  on("[data-savereglas]", async ()=>{
    const m=byId(state.mid);
    m.reglas.avisos = (m.reglas.avisos||[]).filter(a=>String(a).trim());
    render(); await guardar("Reglas guardadas.");
  });

  /* horas */
  v.querySelectorAll("[data-h]").forEach(n=>n.addEventListener("change", e=>{
    const m=byId(state.mid); m.horas = m.horas||{};
    const k=e.target.dataset.h;
    m.horas[k] = e.target.type==="checkbox" ? e.target.checked : (k==="acum"||k==="semana") ? (+e.target.value||0) : e.target.value;
    const w=e.target.closest(".checkbig"); if(w) w.classList.toggle("on", e.target.checked);
  }));
  on("[data-hoy-horas]", ()=>{ const m=byId(state.mid); m.horas.acum = horasAcum(m); m.horas.act = toISO(today()); render(); });
  on("[data-savehoras]", async ()=>{ render(); await guardar("Horas guardadas."); });

  /* acciones y liberación */
  v.querySelectorAll("[data-acc]").forEach(n=>n.addEventListener("change", async e=>{
    const m=byId(state.mid), a=(m.acciones||[]).find(x=>x.n===+e.target.dataset.acc);
    if(a){ a.est=e.target.value; await guardar("Acción actualizada."); }
  }));
  v.querySelectorAll("[data-lib]").forEach(n=>n.addEventListener("change", async e=>{
    const m=byId(state.mid); m.liberacion[+e.target.dataset.lib].ok = e.target.value==="1";
    render(); await guardar("Criterio actualizado.");
  }));

  /* alta */
  if(state.alta){
    const a = state.alta;
    v.querySelectorAll("[data-a]").forEach(n=>{ n.addEventListener("input", e=>{ a.d[e.target.dataset.a]=e.target.value; });
                                               n.addEventListener("change", e=>{ a.d[e.target.dataset.a]=e.target.value; }); });
    v.querySelectorAll("[data-ar]").forEach(n=>n.addEventListener("change", e=>{
      a.d.reglas[e.target.dataset.ar] = e.target.type==="checkbox" ? e.target.checked : e.target.value;
      const w=e.target.closest(".checkbig"); if(w) w.classList.toggle("on", e.target.checked); }));
    v.querySelectorAll("[data-aravisos]").forEach(n=>n.addEventListener("input", e=>{
      a.d.reglas.avisos = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean); }));
    v.querySelectorAll("[data-ah]").forEach(n=>n.addEventListener("change", e=>{
      const k=e.target.dataset.ah;
      a.d.horas[k] = e.target.type==="checkbox" ? e.target.checked : (k==="acum"||k==="semana") ? (+e.target.value||0) : e.target.value;
      const w=e.target.closest(".checkbig"); if(w) w.classList.toggle("on", e.target.checked); }));
    on("[data-yn]", e=>{ a.d[e.currentTarget.dataset.yn] = e.currentTarget.dataset.v==="si"; render(); });
    on("[data-fase]", e=>{ a.step = +e.currentTarget.dataset.fase; render(); });
    on("[data-altafin]", async ()=>{
      const d = a.d, id = String(d.id).toUpperCase().trim();
      if(!id || !d.nombre){ toast("Faltan el código y el nombre."); return; }
      if(byId(id)){ toast(`Ya existe una máquina con el código ${id}.`); return; }
      DB.maquinas.push({id, nombre:d.nombre, grupo:d.grupo, ubic:d.ubic, resp:d.resp, fab:d.fab,
        modelo:d.modelo, serie:d.serie, anio:d.anio, crit:altaCrit(d), doc:d.doc,
        reglas:d.reglas, horas:Object.assign({}, d.horas, {act:toISO(today())}),
        tareas:[], repuestos:[], lubri:[], acciones:[], liberacion:[]});
      state.alta=null; state.mid=id; state.view="maquina"; state.tab="plan"; render();
      await guardar(`${id} dada de alta. Añade ya sus tareas.`);
    });
  }
}

/* ══════════════ RENDER ══════════════ */
function renderNav(){
  const rail=$("#rail"), mob=$("#mobnav"), items=NAV[state.role];
  const venc = agenda().filter(x=>x.st==="vencida").length;
  const pvb  = DB.historial.filter(h=>h.needVB && !h.vb).length;
  const badge = k => k==="tareas"&&venc ? `<span class="count">${venc}</span>` : k==="validaciones"&&pvb ? `<span class="count">${pvb}</span>` : "";
  if(state.role==="mecanico"){ rail.hidden=true; mob.hidden=true; return; }
  rail.hidden=false; mob.hidden=false;
  const cur = k => state.view===k || (k==="maquinas" && (state.view==="maquina"||state.view==="alta"));
  rail.innerHTML = `<div class="lbl">${state.role==="encargado"?"Encargado de planta":"Dirección"}</div>` +
    items.map(([k,l])=>`<button data-nav2="${k}" aria-current="${cur(k)}">${l}${badge(k)}</button>`).join("");
  mob.innerHTML = items.map(([k,l])=>`<button data-nav2="${k}" aria-current="${cur(k)}">${l}</button>`).join("");
  [rail,mob].forEach(n=>n.querySelectorAll("[data-nav2]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.nav2; if(t==="alta") altaInit(); state.view=t; render();
  }));
}
function render(){
  renderNav();
  const views = {tareas:viewTareas, validaciones:viewValidaciones, maquinas:viewMaquinas,
                 maquina:viewMaquina, alta:viewAlta, repuestos:viewRepuestos,
                 averias:viewAverias, cuadro:viewCuadro};
  if(state.view==="alta" && !state.alta) altaInit();
  $("#view").innerHTML = (views[state.view] || viewTareas)();
  bindView();
}

document.querySelectorAll(".roleswitch [data-role]").forEach(b=>b.onclick=()=>{
  if(PERFIL && PERFIL.rol !== "admin") return;
  state.role = b.dataset.role;
  document.querySelectorAll(".roleswitch [data-role]").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  state.view = state.role==="direccion" ? "cuadro" : "tareas";
  state.mid = null; state.alta = null;
  render();
});
$("#syncChip").onclick = () => toast(!CAN
  ? "Tu usuario solo puede consultar."
  : "Los cambios se guardan en el servidor en cuanto pulsas Guardar.");

boot();
})();
</script>
