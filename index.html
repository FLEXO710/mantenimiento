<title>Mantenimiento DORDIV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ─────────────── TOKENS ─────────────── */
:root{
  color-scheme: light;
  --plane:#E9EEF1;
  --surface:#FFFFFF;
  --surface-2:#F4F8F9;
  --surface-3:#E3EBEE;
  --line:#D3DEE3;
  --line-2:#BACAD1;
  --ink:#0B1D24;
  --ink-2:#46606B;
  --ink-3:#7A929C;
  --brand:#0A4A5A;
  --brand-2:#0E6A80;
  --brand-ink:#FFFFFF;
  --wash:#E2EFF2;
  --wash-2:#CFE4E9;

  --ok-bg:#E4F4E4;   --ok-ink:#166B16;   --ok-dot:#0ca30c;
  --warn-bg:#FCF1DA; --warn-ink:#7A5600; --warn-dot:#fab219;
  --crit-bg:#FBE7E7; --crit-ink:#96201F; --crit-dot:#d03b3b;
  --info-bg:#E2EFF2; --info-ink:#0A4A5A; --info-dot:#0E6A80;
  --neut-bg:#EBF0F2; --neut-ink:#46606B; --neut-dot:#7A929C;

  --s1:#2a78d6;  /* serie 1 — preventivo */
  --s2:#eb6834;  /* serie 2 — correctivo */
  --grid:#E1E8EB;
  --axis:#C3D1D7;

  --shadow:0 1px 2px rgba(11,29,36,.06), 0 6px 18px -8px rgba(11,29,36,.16);
  --shadow-lg:0 20px 60px -20px rgba(11,29,36,.4);
  --r:10px;
  --ff:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fm:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#081116;
    --surface:#101E24;
    --surface-2:#152730;
    --surface-3:#1B303A;
    --line:#223B45;
    --line-2:#2F505D;
    --ink:#E7EFF2;
    --ink-2:#9FB6BF;
    --ink-3:#728D98;
    --brand:#4FB3C9;
    --brand-2:#67C6DA;
    --brand-ink:#04191F;
    --wash:#132C35;
    --wash-2:#1A3B47;

    --ok-bg:#12301A;   --ok-ink:#7CD97C;   --ok-dot:#0ca30c;
    --warn-bg:#332609; --warn-ink:#F2C965; --warn-dot:#fab219;
    --crit-bg:#3A1616; --crit-ink:#F09B9B; --crit-dot:#d03b3b;
    --info-bg:#132C35; --info-ink:#7ECDDF; --info-dot:#4FB3C9;
    --neut-bg:#18292F; --neut-ink:#9FB6BF; --neut-dot:#728D98;

    --s1:#3987e5; --s2:#d95926;
    --grid:#1E343D; --axis:#2B4854;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -10px rgba(0,0,0,.7);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#081116; --surface:#101E24; --surface-2:#152730; --surface-3:#1B303A;
  --line:#223B45; --line-2:#2F505D;
  --ink:#E7EFF2; --ink-2:#9FB6BF; --ink-3:#728D98;
  --brand:#4FB3C9; --brand-2:#67C6DA; --brand-ink:#04191F;
  --wash:#132C35; --wash-2:#1A3B47;
  --ok-bg:#12301A; --ok-ink:#7CD97C; --ok-dot:#0ca30c;
  --warn-bg:#332609; --warn-ink:#F2C965; --warn-dot:#fab219;
  --crit-bg:#3A1616; --crit-ink:#F09B9B; --crit-dot:#d03b3b;
  --info-bg:#132C35; --info-ink:#7ECDDF; --info-dot:#4FB3C9;
  --neut-bg:#18292F; --neut-ink:#9FB6BF; --neut-dot:#728D98;
  --s1:#3987e5; --s2:#d95926;
  --grid:#1E343D; --axis:#2B4854;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -10px rgba(0,0,0,.7);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--ff); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ─────────────── SHELL ─────────────── */
.shell{min-height:100dvh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:0 16px; height:56px;
  background:var(--brand); color:var(--brand-ink); position:sticky; top:0; z-index:40;
}
:root[data-theme="dark"] .topbar, :root:not([data-theme="light"]) .topbar{}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .topbar{background:#0B222A;color:var(--ink);} }
:root[data-theme="dark"] .topbar{background:#0B222A;color:var(--ink);}

.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
.brand svg{flex:none;}
.brand b{font-weight:700;}
.brand span{opacity:.72; font-weight:400;}
.topbar .spacer{flex:1;}

.roleswitch{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border-radius:8px; padding:3px;}
:root[data-theme="dark"] .roleswitch{background:rgba(255,255,255,.07);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .roleswitch{background:rgba(255,255,255,.07);} }
.roleswitch button{
  border:0; background:transparent; color:inherit; opacity:.78;
  padding:5px 11px; border-radius:6px; font-size:13px; font-weight:500;
}
.roleswitch button[aria-pressed="true"]{background:var(--surface); color:var(--ink); opacity:1; font-weight:600;}
.demoTag{
  font-family:var(--fm); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  opacity:.6; padding-right:4px;
}
.sync{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-family:var(--fm);
  background:rgba(255,255,255,.12); padding:5px 10px; border-radius:999px; white-space:nowrap;
}
:root[data-theme="dark"] .sync{background:rgba(255,255,255,.07);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sync{background:rgba(255,255,255,.07);} }
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn-dot);display:block;flex:none;}

.body{flex:1; display:flex; min-height:0;}
.rail{
  width:212px; flex:none; background:var(--surface); border-right:1px solid var(--line);
  padding:14px 10px; display:flex; flex-direction:column; gap:2px;
}
.rail .lbl{
  font-family:var(--fm); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); padding:12px 10px 6px;
}
.rail button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  border:0; background:transparent; padding:9px 10px; border-radius:8px;
  font-size:14px; color:var(--ink-2); font-weight:500;
}
.rail button:hover{background:var(--surface-2); color:var(--ink);}
.rail button[aria-current="true"]{background:var(--wash); color:var(--brand); font-weight:600;}
:root[data-theme="dark"] .rail button[aria-current="true"]{color:var(--brand-2);}
.rail .count{margin-left:auto; font-family:var(--fm); font-size:11.5px; background:var(--crit-bg); color:var(--crit-ink); padding:1px 7px; border-radius:999px;}

.rail[hidden], .mobnav[hidden]{display:none !important;}
.main{flex:1; min-width:0; overflow-x:hidden;}
.wrap{max-width:1180px; margin:0 auto; padding:22px 20px 80px;}
.wrap.tab{max-width:820px; padding:18px 16px 90px;}

/* ─────────────── TYPO ─────────────── */
h1{font-size:22px; line-height:1.25; margin:0; font-weight:600; text-wrap:balance;}
h2{font-size:15px; margin:0; font-weight:600;}
.eyebrow{font-family:var(--fm); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin:0 0 3px;}
.sub{color:var(--ink-2); font-size:13.5px; margin:3px 0 0;}
.mono{font-family:var(--fm); font-variant-numeric:tabular-nums;}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.pagehead .spacer{flex:1;}

/* ─────────────── PIECES ─────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);}
.card .hd{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line);}
.card .hd h2{flex:1;}
.card .bd{padding:16px;}

.pill{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  padding:3px 9px; border-radius:999px; white-space:nowrap; letter-spacing:.01em;
}
.pill i{width:6px;height:6px;border-radius:50%;display:block;flex:none;}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink);}   .pill.ok i{background:var(--ok-dot);}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink);} .pill.warn i{background:var(--warn-dot);}
.pill.crit{background:var(--crit-bg);color:var(--crit-ink);} .pill.crit i{background:var(--crit-dot);}
.pill.info{background:var(--info-bg);color:var(--info-ink);} .pill.info i{background:var(--info-dot);}
.pill.neut{background:var(--neut-bg);color:var(--neut-ink);} .pill.neut i{background:var(--neut-dot);}

.code{
  font-family:var(--fm); font-size:12px; font-weight:600; letter-spacing:.04em;
  background:var(--surface-3); color:var(--ink-2); padding:2px 7px; border-radius:5px;
}
.crit-A{background:var(--crit-bg); color:var(--crit-ink);}
.crit-B{background:var(--warn-bg); color:var(--warn-ink);}
.crit-C{background:var(--neut-bg); color:var(--neut-ink);}

.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:8px 14px; border-radius:8px; font-size:14px; font-weight:500;
}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink); font-weight:600;}
.btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2);}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2);}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
.btn.big{padding:13px 18px; font-size:16px; border-radius:10px; width:100%;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.note{
  display:flex; gap:10px; background:var(--wash); border:1px solid var(--wash-2);
  border-radius:8px; padding:11px 13px; font-size:13px; color:var(--ink-2); line-height:1.45;
}
.note b{color:var(--ink);}
.note.warn{background:var(--warn-bg); border-color:transparent; color:var(--warn-ink);}
.note.warn b{color:var(--warn-ink);}
.note svg{flex:none; margin-top:1px;}

/* ─────────────── TASK LIST (mecánico) ─────────────── */
.daybar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:var(--shadow); margin-bottom:16px;
}
.daybar .big{font-size:19px; font-weight:600; letter-spacing:-.01em;}
.daybar .spacer{flex:1;}
.load{min-width:240px; flex:1;}
.load .row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); margin-bottom:5px;}
.load .track{height:7px; border-radius:999px; background:var(--surface-3); overflow:hidden; display:flex;}
.load .fill{height:100%; background:var(--brand);}
.load .fill.hi{background:var(--warn-dot);}

.group{margin:22px 0 10px; display:flex; align-items:center; gap:9px;}
.group h2{font-size:12px; font-family:var(--fm); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:500;}
.group .n{font-family:var(--fm); font-size:12px; color:var(--ink-3);}
.group hr{flex:1; border:0; border-top:1px solid var(--line); margin:0;}

.tasks{display:flex; flex-direction:column; gap:9px;}
.task{
  display:flex; align-items:stretch; gap:0; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:0; overflow:hidden; box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease;
}
.task:hover{border-color:var(--line-2); transform:translateY(-1px);}
.task .stripe{width:4px; flex:none; background:var(--neut-dot);}
.task.s-vencida .stripe{background:var(--crit-dot);}
.task.s-hoy .stripe{background:var(--brand);}
.task.s-hecha .stripe{background:var(--ok-dot);}
.task.s-pospuesta .stripe{background:var(--warn-dot);}
.task .in{flex:1; padding:13px 15px; min-width:0;}
.task .t1{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px;}
.task .name{font-size:16px; font-weight:600; line-height:1.3; margin:0 0 4px; text-wrap:balance;}
.task .t2{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2);}
.task .t2 .mono{font-size:12px;}
.task .go{display:flex; align-items:center; padding-right:14px; color:var(--ink-3);}
.task.s-hecha{opacity:.72;}

.quickrow{display:flex; gap:10px; margin-top:18px;}
.quickrow .btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px; font-weight:600;}

/* ─────────────── TABLES ─────────────── */
.tablewrap{overflow-x:auto;}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:560px;}
th{
  text-align:left; font-family:var(--fm); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:0;}
td.num{text-align:right; font-family:var(--fm); font-variant-numeric:tabular-nums;}
th.num{text-align:right;}
tbody tr:hover{background:var(--surface-2);}

/* ─────────────── KPI ─────────────── */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow);}
.kpi .k{font-size:12px; color:var(--ink-2); margin-bottom:8px; font-weight:500;}
.kpi .v{font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1;}
.kpi .v small{font-size:16px; font-weight:500; color:var(--ink-2); margin-left:2px;}
.kpi .d{font-size:12px; margin-top:8px; color:var(--ink-2); display:flex; align-items:center; gap:5px;}
.kpi .d.up{color:var(--ok-ink);} .kpi .d.down{color:var(--crit-ink);}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-bottom:12px;}
.legend span{display:flex; align-items:center; gap:6px;}
.legend i{width:10px;height:10px;border-radius:3px;display:block;}

/* ─────────────── PLAN GRID ─────────────── */
.plangrid{overflow-x:auto; padding-bottom:4px;}
.plangrid table{min-width:820px; font-size:12px;}
.plangrid th.wk{
  padding:6px 0; text-align:center; width:22px; font-size:9.5px; letter-spacing:0;
  font-family:var(--fm); color:var(--ink-3);
}
.plangrid td.tname{white-space:nowrap; padding:6px 12px 6px 4px; font-size:12.5px; border-bottom:1px solid var(--line);}
.plangrid td.c{padding:0; width:22px; border-bottom:1px solid var(--surface); border-right:1px solid var(--surface);}
.plangrid .cell{height:20px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff;}
.plangrid .f-semanal{background:var(--s1);}
.plangrid .f-mensual{background:var(--s2);}
.plangrid .f-anual{background:var(--brand);}
.plangrid .f-none{background:var(--surface-2);}
.plangrid .f-off{background:repeating-linear-gradient(45deg,var(--surface-3),var(--surface-3) 3px,var(--surface-2) 3px,var(--surface-2) 6px);}
.plangrid td.now{box-shadow:inset 0 0 0 2px var(--ink);}
.planlegend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin:12px 0 0;}
.planlegend span{display:flex;align-items:center;gap:6px;}
.planlegend i{width:12px;height:12px;border-radius:3px;display:block;}

/* ─────────────── MODAL ─────────────── */
.scrim{
  position:fixed; inset:0; background:rgba(6,18,23,.55); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;
}
@media (min-width:760px){ .scrim{align-items:center; padding:24px;} }
.sheet{
  background:var(--surface); width:100%; max-width:660px; max-height:94dvh;
  border-radius:16px 16px 0 0; display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
  animation:rise .22s ease-out;
}
@media (min-width:760px){ .sheet{border-radius:14px;} }
@keyframes rise{from{transform:translateY(18px); opacity:0;} to{transform:none; opacity:1;}}
.sheet header{padding:16px 18px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start;}
.sheet header .x{margin-left:auto; border:0; background:transparent; color:var(--ink-3); padding:4px; border-radius:6px;}
.sheet header .x:hover{background:var(--surface-2); color:var(--ink);}
.sheet .content{padding:18px; overflow-y:auto; flex:1;}
.sheet footer{padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--surface-2); border-radius:0 0 14px 14px;}
.sheet footer .spacer{flex:1;}

.steps{display:flex; gap:4px; padding:0 18px 14px;}
.steps div{flex:1; height:3px; border-radius:999px; background:var(--surface-3);}
.steps div.on{background:var(--brand);}
.steps div.done{background:var(--ok-dot);}

.field{margin-bottom:16px;}
.field > label{display:block; font-size:13px; font-weight:600; margin-bottom:7px;}
.field .help{font-size:12.5px; color:var(--ink-2); margin:-3px 0 8px;}
input[type=text], input[type=number], input[type=email], input[type=password], input[type=date], textarea, select{
  width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:8px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
}
textarea{min-height:76px; resize:vertical;}
input:focus, textarea:focus, select:focus{border-color:var(--brand-2); outline:none; box-shadow:0 0 0 3px var(--wash);}

.checkbig{
  display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid var(--line-2);
  border-radius:10px; cursor:pointer; background:var(--surface);
}
.checkbig:hover{background:var(--surface-2);}
.checkbig input{width:22px;height:22px;margin:0; flex:none; accent-color:var(--brand);}
.checkbig .txt{font-size:14.5px; line-height:1.4;}
.checkbig.on{border-color:var(--ok-dot); background:var(--ok-bg);}
.checkbig.on .txt{color:var(--ok-ink);}

.chk{display:flex; flex-direction:column; gap:8px;}
.chkitem{border:1px solid var(--line); border-radius:9px; padding:11px 13px; background:var(--surface);}
.chkitem .top{display:flex; gap:10px; align-items:center;}
.chkitem .lbl{flex:1; font-size:14.5px; line-height:1.35;}
.seg{display:flex; gap:0; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; flex:none;}
.seg button{border:0; background:var(--surface); padding:7px 11px; font-size:12.5px; color:var(--ink-2); border-right:1px solid var(--line);}
.seg button:last-child{border-right:0;}
.seg button:hover{background:var(--surface-2);}
.seg button.on-ok{background:var(--ok-dot); color:#fff; font-weight:600;}
.seg button.on-no{background:var(--crit-dot); color:#fff; font-weight:600;}
.seg button.on-na{background:var(--neut-dot); color:#fff; font-weight:600;}
.seg button.on-sel{background:var(--brand); color:var(--brand-ink); font-weight:600;}

.photos{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.photo{
  border:2px dashed var(--line-2); border-radius:10px; aspect-ratio:4/3; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:7px; color:var(--ink-2);
  background:var(--surface-2); font-size:13px; font-weight:500; position:relative; overflow:hidden; padding:8px;
  text-align:center;
}
.photo:hover{border-color:var(--brand-2); color:var(--brand);}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo .tag{
  position:absolute; left:8px; bottom:8px; background:rgba(6,18,23,.78); color:#fff;
  font-family:var(--fm); font-size:10px; padding:3px 7px; border-radius:5px; letter-spacing:.03em;
}
.photo.filled{border-style:solid; border-color:var(--ok-dot);}

<script>
(() => {
"use strict";

/* ══════════════ DATOS ══════════════ */
let DB;
try { DB = JSON.parse(document.getElementById("db").textContent || "{}"); } catch(e) { DB = {}; }
if(!DB || !Array.isArray(DB.maquinas)) DB = {meta:{v:1}, grupos:["Producción"], personas:[], maquinas:[], historial:[], averias:[]};
DB.historial = DB.historial || [];
DB.averias   = DB.averias   || [];
const byId = (id) => DB.maquinas.find(m => m.id === id);

const UNIDADES = ["Días laborables","Semanas","Meses","Horas de trabajo"];
const PERFILES = ["Operador","Mantenimiento","Electricista / PRL","Especialista externo"];
const FOTOS    = ["Antes y después","Solo después","No hacen falta"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

/* ══════════════ FECHAS Y PROGRAMACIÓN ══════════════ */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseISO(s){ if(!s) return null; const p=String(s).split("-").map(Number); return p.length===3 ? new Date(p[0],p[1]-1,p[2]) : null; }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addWork(d,n){ let x=new Date(d),c=0; while(c<n){ x=addDays(x,1); const w=x.getDay(); if(w!==0&&w!==6) c++; } return x; }
function fmtD(d){ return d ? d.getDate()+" "+MES[d.getMonth()] : "—"; }
function fmtFull(d){ return d ? d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear() : "—"; }
function diffDays(a,b){ return Math.round((a-b)/86400000); }
function semanaISO(d){ const t=new Date(d); t.setDate(t.getDate()+4-(t.getDay()||7)); const y=new Date(t.getFullYear(),0,1); return Math.ceil(((t-y)/86400000+1)/7); }

function horasAcum(m){
  const h = m.horas || {}; const base = +h.acum || 0; const d = parseISO(h.act);
  if(!d || !h.semana) return base;
  return Math.round(base + (+h.semana) * (Math.max(0, diffDays(today(), d)) / 7));
}
function proxima(m, t){
  const hoy = today(), base = parseISO(t.last) || hoy;
  const cands = [];
  const cada = Math.max(1, +t.cada || 1);
  if(t.unidad === "Días laborables") cands.push(addWork(base, cada));
  else if(t.unidad === "Semanas")    cands.push(addDays(base, 7*cada));
  else if(t.unidad === "Meses")      cands.push(addDays(base, Math.round(30.44*cada)));
  else if(t.unidad === "Horas de trabajo"){
    const hs = +((m.horas||{}).semana) || 0, ac = horasAcum(m);
    const lh = (t.lastH != null) ? +t.lastH : ac;
    const falta = cada - (ac - lh);
    cands.push(hs > 0 ? addDays(hoy, Math.ceil(falta/(hs/7))) : addDays(hoy, 999));
  }
  if(t.cadaH){
    const hs = +((m.horas||{}).semana) || 0, ac = horasAcum(m);
    const lh = (t.lastH != null) ? +t.lastH : ac;
    const falta = (+t.cadaH) - (ac - lh);
    if(hs > 0) cands.push(addDays(hoy, Math.ceil(falta/(hs/7))));
  }
  if(!cands.length) return hoy;
  return new Date(Math.min.apply(null, cands));
}
function estadoTarea(m,t){
  const d = diffDays(proxima(m,t), today());
  return {due: proxima(m,t), d, st: d < 0 ? "vencida" : d === 0 ? "hoy" : d <= 7 ? "proxima" : "futura"};
}
function agenda(){
  const out = [];
  DB.maquinas.forEach(m => (m.tareas||[]).forEach(t => {
    const e = estadoTarea(m,t);
    if(e.st !== "futura") out.push({m, t, ...e});
  }));
  const rank = {vencida:0, hoy:1, proxima:2};
  return out.sort((a,b) => rank[a.st]-rank[b.st] || a.d-b.d || (b.m.crit==="A") - (a.m.crit==="A"));
}
function freqTexto(t){
  const u = (t.unidad||"").toLowerCase();
  const n = +t.cada || 1;
  let s = t.unidad === "Días laborables" ? (n===1 ? "diario" : `cada ${n} días laborables`)
        : t.unidad === "Semanas"         ? (n===1 ? "semanal" : `cada ${n} semanas`)
        : t.unidad === "Meses"           ? (n===1 ? "mensual" : n===3 ? "trimestral" : n===6 ? "semestral" : n===12 ? "anual" : `cada ${n} meses`)
        : `cada ${n} h`;
  if(t.cadaH) s += ` / ${nfmt(t.cadaH)} h`;
  return s;
}
function cargaSemanal(m){
  return (m.tareas||[]).reduce((s,t) => {
    const c = Math.max(1, +t.cada||1), hs = +((m.horas||{}).semana)||0;
    const v = t.unidad==="Días laborables" ? 5/c : t.unidad==="Semanas" ? 1/c
            : t.unidad==="Meses" ? 1/(4.33*c) : (hs/c);
    return s + v*(+t.min||0);
  }, 0);
}

const $ = (s,r=document) => r.querySelector(s);

const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nfmt = (n,d=0) => { const p=Math.abs(+n||0).toFixed(d).split("."); return (n<0?"−":"")+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+(p[1]?","+p[1]:""); };
const hm = (m) => { m=Math.round(m); return m>=60 ? `${Math.floor(m/60)} h${m%60?" "+(m%60)+" min":""}` : `${m} min`; };
const uid = (p) => p + "-" + Math.random().toString(36).slice(2,7);

  setTimeout(()=>{ r.innerHTML=""; }, 3600);
}
const ICON = {
  chevron:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  camera:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.1-2h8.4l1.1 2h2.2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.6"/></svg>',
  warn:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4.5 21 19H3l9-14.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1" fill="currentColor"/></svg>',
  info:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.9" r="1.05" fill="currentColor"/></svg>',
  qr:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="8" y="8" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.6"/></svg>',
  bolt:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M13 3 5 13.5h5.5L10 21l8-10.5h-5.5L13 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  plus:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};
const critPill = (c) => `<span class="code crit-${c||"C"}" title="Criticidad ${c||"C"}">${c||"C"}</span>`;
const freqPill = (s) => {
  const x = String(s).toLowerCase();
  const cls = x.startsWith("p0") ? "crit" : /\bh\b|\sh$|\/\s*\d/.test(x) ? "warn"
            : /anual|semestral|trimestral/.test(x) ? "info" : "neut";
  return `<span class="pill ${cls}"><i></i>${esc(s)}</span>`;
};

/* ══════════════ CONEXIÓN, SESIÓN Y GUARDADO ══════════════ */
/* Configuración del servidor. Si se rellena aquí, nadie tiene que escribirla. */
const CFG_INTEGRADA = {url:"https://rwpywrohfnifkunjfrov.supabase.co", key:"sb_publishable_uYQ_5iQqZ3ee3gOAqtS1IQ_JuQluUUG"};

const K_CFG = "dordiv.cfg", K_SES = "dordiv.ses";
let CFG=null, SES=null, PERFIL=null, VER=0, SAVING=false, CAN=false;
const SEMILLA = JSON.parse(JSON.stringify(DB));

try{ CFG = JSON.parse(localStorage.getItem(K_CFG) || "null"); }catch(e){}
try{ SES = JSON.parse(localStorage.getItem(K_SES) || "null"); }catch(e){}
if(CFG_INTEGRADA.url && CFG_INTEGRADA.key) CFG = CFG_INTEGRADA;

const base = () => String(CFG.url||"").replace(/\/+$/,"");
function guardaCfg(c){ CFG=c; try{ localStorage.setItem(K_CFG, JSON.stringify(c)); }catch(e){} }
function guardaSes(s){ SES=s; try{ s ? localStorage.setItem(K_SES, JSON.stringify(s)) : localStorage.removeItem(K_SES); }catch(e){} }
function H(json, auth){
  if(auth===undefined) auth = true;
  const h = {apikey: CFG.key};
  if(auth && SES && SES.access_token) h.Authorization = "Bearer " + SES.access_token;
  if(json) h["Content-Type"] = "application/json";
  return h;
}
function setSync(s, txt){
  const c = document.getElementById("syncChip"); if(!c) return;
  c.hidden = false; c.dataset.s = s; c.querySelector("span").textContent = txt;
}
async function refrescar(){
  if(!SES || !SES.refresh_token) return false;
  try{
    const r = await fetch(base()+"/auth/v1/token?grant_type=refresh_token",
      {method:"POST", headers:{apikey:CFG.key,"Content-Type":"application/json"},
       body: JSON.stringify({refresh_token: SES.refresh_token})});
    if(!r.ok) return false;
    guardaSes(await r.json()); return true;
  }catch(e){ return false; }
}
async function rest(path, opts, reintenta){
  opts = opts || {};
  const r = await fetch(base()+path, opts);
  if(r.status===401 && reintenta!==false && await refrescar()){
    opts.headers = Object.assign({}, opts.headers, {Authorization:"Bearer "+SES.access_token});
    return rest(path, opts, false);
  }
  return r;
}
async function entrar(email, pass){
  const r = await fetch(base()+"/auth/v1/token?grant_type=password",
    {method:"POST", headers:{apikey:CFG.key,"Content-Type":"application/json"},
     body: JSON.stringify({email:email, password:pass})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "Usuario o contraseña incorrectos.");
  guardaSes(j);
}
function salir(){ guardaSes(null); location.reload(); }

async function cargarPerfil(){
  const r = await rest("/rest/v1/perfiles?select=nombre,rol&limit=1", {headers:H()});
  if(!r.ok) throw new Error("No se ha podido leer tu perfil ("+r.status+"). ¿Está creada la tabla «perfiles»?");

async function cargarEstado(){
  const r = await rest("/rest/v1/estado?id=eq.1&select=datos,version", {headers:H()});
  if(!r.ok) throw new Error("No se ha podido leer la base de datos ("+r.status+"). Revisa que el esquema esté instalado.");
  const j = await r.json();
  if(j.length){ DB = j[0].datos || {}; VER = j[0].version || 0; }
  else {
    const c = await rest("/rest/v1/estado", {method:"POST",
      headers: Object.assign(H(true), {Prefer:"return=representation"}),
      body: JSON.stringify({id:1, datos:SEMILLA, version:0})});
    if(c.ok){ const k = await c.json(); DB = k[0].datos; VER = k[0].version; }
    else { DB = SEMILLA; VER = 0; }
  }
  DB.maquinas  = DB.maquinas  || [];
  DB.historial = DB.historial || [];
  DB.averias   = DB.averias   || [];
  DB.grupos    = DB.grupos    || ["Producción"];
  DB.personas  = DB.personas  || [];
  DB.ajustes   = DB.ajustes   || {tarifaHora:0, costeParoHora:0};
}
async function guardar(msg){
  if(SAVING) return false;
  if(!CAN){ toast("Tu usuario solo puede consultar, no editar."); return false; }
  SAVING = true; setSync("saving","Guardando…");
  DB.meta = DB.meta || {}; DB.meta.updated = toISO(today());
  try{
    const r = await rest("/rest/v1/estado?id=eq.1&version=eq."+VER, {method:"PATCH",
      headers: Object.assign(H(true), {Prefer:"return=representation"}),
      body: JSON.stringify({datos:DB, version:VER+1, actualizado_por:(PERFIL&&PERFIL.nombre)||"", actualizado:new Date().toISOString()})});
    if(!r.ok){ SAVING=false; setSync("err","Error"); toast("No se ha podido guardar ("+r.status+")."); return false; }
    const j = await r.json();
    if(!j.length){
      SAVING=false; setSync("err","Conflicto");
      toast("Otra persona ha guardado mientras editabas. Recargando con su versión…");
      setTimeout(()=>location.reload(), 2200); return false;
    }
    VER = j[0].version; SAVING=false; setSync("ok","Guardado");
    if(msg) toast(msg);
    return true;
  }catch(e){
    SAVING=false; setSync("err","Sin conexión");
    toast("Sin conexión con el servidor. El cambio no se ha guardado — vuelve a intentarlo.");
    return false;
  }
}

/* ── Fotos ── */
function comprimir(dataUrl, max, q){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      let w = im.width, h = im.height;
      if(Math.max(w,h) > max){ const f = max/Math.max(w,h); w = Math.round(w*f); h = Math.round(h*f); }
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      res(c.toDataURL("image/jpeg", q||0.72));
    };
    im.onerror = () => res(dataUrl);
    im.src = dataUrl;
  });
}
async function subirFoto(ruta, dataUrl){
  try{
    const chico = await comprimir(dataUrl, 1400, 0.72);
    const blob = await (await fetch(chico)).blob();
    const r = await rest("/storage/v1/object/evidencias/"+ruta, {method:"POST",
      headers: Object.assign(H(false), {"Content-Type": blob.type||"image/jpeg", "x-upsert":"true"}),
      body: blob});
    return r.ok ? ruta : null;
  }catch(e){ return null; }
}
async function firmarFoto(ruta){
  try{
    const r = await rest("/storage/v1/object/sign/evidencias/"+ruta, {method:"POST",
      headers:H(true), body: JSON.stringify({expiresIn:3600})});
    if(!r.ok) return null;
    const j = await r.json();
    return base()+"/storage/v1"+(j.signedURL||j.signedUrl||"");
  }catch(e){ return null; }
}

function pantallaLogin(err){
  gate(`<div class="gatebox">${marca}
    <h1>Entrar</h1>

  document.getElementById("l_ok").onclick = go;

function pintarUsuario(){
  const c = document.getElementById("userChip");
  const rol = {admin:"Administrador", mantenimiento:"Mantenimiento", encargado:"Encargado", direccion:"Dirección"}[PERFIL.rol] || PERFIL.rol;

async function boot(){
  if(!CFG || !CFG.url || !CFG.key){ pantallaConfig(); return; }
  if(!SES || !SES.access_token){ pantallaLogin(); return; }
  try{
    PERFIL = await cargarPerfil();
    if(!PERFIL){ guardaSes(null); pantallaLogin("Tu usuario existe pero no tiene perfil. Pide al administrador que te dé de alta en la tabla de perfiles."); return; }
    await cargarEstado();
  }catch(e){
    pantallaLogin(e.message || "No se ha podido conectar con el servidor.");
    return;
  }
  CAN = ["admin","mantenimiento","encargado"].indexOf(PERFIL.rol) > -1;
  state.role = PERFIL.rol === "direccion" ? "direccion" : PERFIL.rol === "mantenimiento" ? "mecanico" : "encargado";
  state.view = state.role === "direccion" ? "cuadro" : "tareas";
  gate("");
  setSync("ok","Guardado");
  pintarUsuario();
  render();
}

function viewTareas(){
  const ag = agenda();
  const venc = ag.filter(x=>x.st==="vencida"), hoy = ag.filter(x=>x.st==="hoy"), prox = ag.filter(x=>x.st==="proxima");
  const totalMin = venc.concat(hoy).reduce((s,x)=>s+(+x.t.min||0),0);
  const pct = Math.min(100, Math.round(totalMin/480*100));
  const d = today();
  const hechasHoy = DB.historial.filter(h => h.fecha === toISO(d));

  const card = (x) => {
    const badge = x.st==="vencida" ? `<span class="pill crit"><i></i>Vencida hace ${-x.d} ${-x.d===1?"día":"días"}</span>`
      : x.st==="hoy" ? `<span class="pill info"><i></i>Hoy</span>`
      : `<span class="pill neut"><i></i>${fmtD(x.due)}</span>`;
    return `<button class="task s-${x.st}" data-open="${x.m.id}|${x.t.id}">
      <span class="stripe"></span>
      <span class="in">
        <span class="t1"><span class="code">${esc(x.m.id)}</span>${critPill(x.m.crit)}${badge}${x.t.parada?'<span class="pill warn"><i></i>Con parada</span>':""}</span>
        <span class="name">${esc(x.t.nombre)}</span>
        <span class="t2">
          <span>${esc(x.m.nombre)}${x.m.ubic?" · "+esc(x.m.ubic):""}</span>
          ${freqPill(freqTexto(x.t))}
          <span class="mono">${hm(x.t.min)}</span>
          <span>${esc(x.t.perfil||"")}</span>
        </span>
      </span>
      <span class="go">${ICON.chevron}</span>
    </button>`;
  };
  const grp = (title,items) => items.length ? `
    <div class="group"><h2>${title}</h2><span class="n">${items.length}</span><hr></div>
    <div class="tasks">${items.map(card).join("")}</div>` : "";

  const sinPlan = DB.maquinas.filter(m => !(m.tareas||[]).length);

  return `
  <div class="wrap ${state.role==="mecanico"?"tab":""}">
    <div class="daybar">
      <div>
        <p class="eyebrow">Semana ${semanaISO(d)} · ${d.getFullYear()}</p>
        <div class="big">${DIAS[d.getDay()][0].toUpperCase()+DIAS[d.getDay()].slice(1)}, ${fmtFull(d)}</div>
        <p class="sub">${state.role==="mecanico"?"Mantenimiento":state.role==="encargado"?"Encargado de planta":"Solo lectura"}</p>
      </div>
      <div class="spacer"></div>
      <div class="load">
        <div class="row"><span>Carga de hoy y atrasos</span><span class="mono">${hm(totalMin)} de 8 h</span></div>
        <div class="track"><div class="fill ${pct>75?"hi":""}" style="width:${pct}%"></div></div>
        ${pct>75?`<div class="reqline" style="color:var(--warn-ink)">${ICON.warn} Jornada muy cargada — conviene repartir</div>`:""}
      </div>
    </div>

    ${venc.length?`<div class="note warn" style="margin-bottom:4px">${ICON.warn}<div><b>${venc.length} ${venc.length===1?"tarea vencida":"tareas vencidas"}.</b> Van siempre las primeras: cuentan como incumplimiento del plan.</div></div>`:""}

    ${grp("Vencidas", venc)}
    ${grp("Para hoy", hoy)}
    ${grp("Próximos 7 días", prox)}

    ${(!ag.length)?`<div class="card"><div class="emptystate">
      <h3>No hay ninguna tarea programada</h3>
      <p>Las tareas aparecen solas en cuanto una máquina tenga su plan cargado. ${sinPlan.length?`Ahora mismo hay ${sinPlan.length} ${sinPlan.length===1?"máquina":"máquinas"} sin plan.`:""}</p>
      ${RO()?"":`<button class="btn primary" data-nav="maquinas">Ir a máquinas</button>`}
    </div></div>`:""}

    ${hechasHoy.length?`
      <div class="group"><h2>Cerradas hoy</h2><span class="n">${hechasHoy.length}</span><hr></div>
      <div class="tasks">${hechasHoy.map(h=>`<div class="task s-hecha"><span class="stripe"></span><span class="in">
        <span class="t1"><span class="code">${esc(h.mid)}</span><span class="pill ${h.vb?"ok":"warn"}"><i></i>${h.vb?"Liberada":"Pendiente de visto bueno"}</span></span>
        <span class="name">${esc(h.tarea)}</span>
        <span class="t2"><span>${esc(h.por)} · ${esc(h.hora)}</span><span class="mono">${h.min} min</span>${h.prov?'<span class="pill warn"><i></i>Arreglo provisional</span>':""}</span>
      </span></div>`).join("")}</div>`:""}

    ${RO()?"":`<div class="quickrow">
      <button class="btn" data-nav="maquinas">${ICON.qr} Máquinas</button>
      <button class="btn" data-act="averia">${ICON.bolt} Solicitud de reparación</button>
    </div>`}
  </div>`;
}

/* ══════════════ VISTA · REPUESTOS ══════════════ */
const normRep = (s) => String(s||"").toLowerCase().trim().replace(/\s+/g," ");
function mapaCompartidos(){
  const m = {};
  DB.maquinas.forEach(mq => (mq.repuestos||[]).forEach(p => {
    const k = normRep(p.name);
    (m[k] = m[k] || []).push(mq.id);
  }));
  return m;
}
function estadoRep(p){
  return p.stock===0 ? '<span class="pill crit"><i></i>Sin stock</span>'
       : p.stock < p.min ? '<span class="pill warn"><i></i>Bajo mínimo</span>'
       : '<span class="pill ok"><i></i>Correcto</span>';
}
function nivelPill(ref){
  return `<span class="pill ${ref==="P0"?"crit":ref==="P1"?"warn":"neut"}"><i></i>${esc(ref)}</span>`;
}

function viewRepuestos(){
  const comp = mapaCompartidos();
  const conRep = DB.maquinas.filter(m => (m.repuestos||[]).length);
  const sinRep = DB.maquinas.filter(m => !(m.repuestos||[]).length);
  const todos = [];
  DB.maquinas.forEach(m => (m.repuestos||[]).forEach(p => todos.push({m,p})));
  const bajo = todos.filter(x => x.p.stock < x.p.min);
  const sinStock = todos.filter(x => x.p.stock === 0);
  const p0 = todos.filter(x => x.p.ref === "P0" && x.p.stock < x.p.min);
  const plazoLargo = todos.filter(x => (+x.p.plazo||0) >= 21 && x.p.stock < x.p.min);
  const refsUnicas = Object.keys(comp).length;

  const kpi = (k,v,u,d,cls="") => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}${u?`<small> ${u}</small>`:""}</div>${d?`<div class="d ${cls}">${d}</div>`:""}</div>`;

  const bloque = (m) => {
    const ps = (m.repuestos||[]).slice().sort((x,y)=> (x.ref>y.ref?1:x.ref<y.ref?-1:0) || (x.stock<x.min?-1:1));
    const b = ps.filter(p=>p.stock<p.min).length;
    const sin = ps.filter(p=>p.stock===0).length;
    const abierto = !!state.repAbierto[m.id];
    return `<div class="card" style="margin-bottom:14px">
      <div class="hd plegable" data-togglerep="${esc(m.id)}" role="button" tabindex="0" aria-expanded="${abierto}">
        <span class="chev">${ICON.chevron}</span>
        <span class="code">${esc(m.id)}</span>${critPill(m.crit)}
        <h2>${esc(m.nombre)}</h2>
        <div style="flex:1"></div>
        <span class="sub">${ps.length} ${ps.length===1?"referencia":"referencias"}</span>
        ${sin?`<span class="pill crit"><i></i>${sin} sin stock</span>`:""}
        ${b?`<span class="pill warn"><i></i>${b} bajo mínimo</span>`:'<span class="pill ok"><i></i>Al día</span>'}
        ${RO()?"":`<button class="btn ghost" data-irmaq="${esc(m.id)}" style="padding:4px 10px">Abrir ficha</button>`}
      </div>
      ${!abierto ? "" : `<div class="tablewrap"><table>
        <thead><tr><th style="width:58px">Nivel</th><th>Repuesto</th><th class="num">Stock</th><th class="num">Mín.</th><th>Proveedor</th><th class="num">Plazo</th><th style="width:130px">Estado</th></tr></thead>
        <tbody>${ps.map(p=>{
          const otras = (comp[normRep(p.name)]||[]).filter(id=>id!==m.id);
          return `<tr>
            <td>${nivelPill(p.ref)}</td>
            <td><b>${esc(p.name)}</b>
              ${otras.length?`<div class="sub" style="font-size:12px">También en ${esc(otras.join(", "))}</div>`:""}
              ${p.nota?`<div class="sub" style="font-size:12px">${esc(p.nota)}</div>`:""}</td>
            <td class="num" style="${p.stock===0?"color:var(--crit-ink);font-weight:600":""}">${p.stock}</td>
            <td class="num">${p.min}</td>
            <td class="sub">${esc(p.prov||"—")}</td>
            <td class="num" style="${(+p.plazo||0)>=21?"color:var(--warn-ink)":""}">${p.plazo||0} d</td>
            <td>${estadoRep(p)}</td>
          </tr>`;}).join("")}</tbody>
      </table></div>`}
    </div>`;
  };

  return `<div class="wrap">
    <div class="pagehead">
      <div><p class="eyebrow">Almacén</p><h1>Repuestos por máquina</h1>
      <p class="sub">${todos.length} referencias asociadas · ${refsUnicas} distintas · ${conRep.length} de ${DB.maquinas.length} máquinas con repuestos</p></div>
      <div class="spacer"></div>
      ${conRep.length?`<button class="btn" data-repall="${conRep.every(m=>state.repAbierto[m.id])?"0":"1"}">${conRep.every(m=>state.repAbierto[m.id])?"Plegar todo":"Desplegar todo"}</button>`:""}
    </div>

    ${p0.length?`<div class="note warn" style="margin-bottom:12px">${ICON.warn}<div><b>${p0.length} ${p0.length===1?"repuesto crítico (P0) por debajo del mínimo":"repuestos críticos (P0) por debajo del mínimo"}.</b> Son los que bloquean una reparación: ${esc(p0.map(x=>x.m.id+" · "+x.p.name).join(" / "))}.</div></div>`:""}
    ${plazoLargo.length?`<div class="note warn" style="margin-bottom:12px">${ICON.warn}<div><b>${plazoLargo.length} ${plazoLargo.length===1?"referencia":"referencias"} con más de 3 semanas de plazo y sin stock suficiente.</b> Con esos plazos hay que tenerlas en la estantería aunque se usen una vez al año.</div></div>`:""}

    <div class="kpis">
      ${kpi("Referencias asociadas", todos.length, "", `${refsUnicas} distintas`)}
      ${kpi("Bajo mínimo", bajo.length, "", bajo.length?"Reponer":"Stock correcto", bajo.length?"down":"up")}
      ${kpi("Sin stock", sinStock.length, "", sinStock.length?"Riesgo inmediato":"Ninguna", sinStock.length?"down":"up")}
      ${kpi("Máquinas sin repuestos", sinRep.length, "", sinRep.length?"Sin nada asociado todavía":"Todas cubiertas", sinRep.length?"down":"up")}
    </div>

    ${conRep.length ? conRep.map(bloque).join("")
      : `<div class="card"><div class="emptystate"><h3>Todavía no hay repuestos asociados</h3>
          <p>Los repuestos se añaden desde la ficha de cada máquina, en la pestaña Repuestos. Quedan asociados a esa máquina y aparecen aquí agrupados.</p></div></div>`}

    ${sinRep.length?`<div class="card">
      <div class="hd"><h2>Máquinas sin repuestos asociados</h2><div style="flex:1"></div><span class="sub">${sinRep.length}</span></div>
      <div class="bd">
        <div class="chiprow">${sinRep.map(m=>`<span class="chipdel" style="padding-right:11px"><span class="code">${esc(m.id)}</span> ${esc(m.nombre)}</span>`).join("")}</div>
        <div class="note" style="margin-top:14px">${ICON.info}<div>Una máquina crítica sin ningún repuesto asociado es una avería esperando a pasar. Aunque solo apuntes dos o tres piezas y su plazo de entrega, ya sabrás qué te va a doler.</div></div>
      </div>
    </div>`:""}

    <p class="footnote">Un mismo repuesto puede estar asociado a varias máquinas: se marca solo cuando coincide la descripción.</p>
  </div>`;
}

/* ══════════════ AGREGADOS PARA EL CUADRO DE MANDO ══════════════ */
function ajustes(){ DB.ajustes = DB.ajustes || {tarifaHora:0, costeParoHora:0}; return DB.ajustes; }
function ultimosMeses(n){
  const out = [], d = today();
  for(let i=n-1; i>=0; i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); out.push({y:x.getFullYear(), m:x.getMonth(), l:MES[x.getMonth()]}); }
  return out;
}
const enMes = (iso,mm) => { const p = parseISO(iso); return p && p.getFullYear()===mm.y && p.getMonth()===mm.m; };
const desde = (dias) => addDays(today(), -dias);

function serieCumplimiento(ms){
  return ms.map(mm => {
    const hs = DB.historial.filter(h => enMes(h.fecha, mm));
    return hs.length ? Math.round(hs.filter(h=>!h.tarde).length / hs.length * 100) : null;
  });
}
function serieParo(ms){ return ms.map(mm => DB.averias.filter(a => enMes(a.fecha, mm)).reduce((s,a)=>s+(+a.paro||0), 0)); }
function serieAverias(ms){ return ms.map(mm => DB.averias.filter(a => enMes(a.fecha, mm)).length); }
function seriePartes(ms){ return ms.map(mm => DB.historial.filter(h => enMes(h.fecha, mm)).length); }

function averiasEn(dias){ const d0 = desde(dias); return DB.averias.filter(a => { const p = parseISO(a.fecha); return p && p >= d0; }); }
function horasMarcha(dias){ return DB.maquinas.reduce((s,m) => s + (+((m.horas||{}).semana)||0) * (dias/7), 0); }
function disponibilidad(dias){
  const marcha = horasMarcha(dias); if(!marcha) return null;
  const paro = averiasEn(dias).reduce((s,a)=>s+(+a.paro||0),0);
  return Math.max(0, Math.round((marcha - paro)/marcha*1000)/10);
}
function mtbf(dias){
  const n = averiasEn(dias).length, marcha = horasMarcha(dias);
  return (!n || !marcha) ? null : marcha/n;
}
function mttr(){ const n = DB.averias.length; return n ? DB.averias.reduce((s,a)=>s+(+a.rep||0),0)/n : null; }

function costePorMaquina(){
  const a = ajustes(), th = +a.tarifaHora||0, cp = +a.costeParoHora||0;
  return DB.maquinas.map(m => {
    const prev = DB.historial.filter(h=>h.mid===m.id).reduce((s,h)=>s+(+h.min||0),0)/60*th;
    const av   = DB.averias.filter(x=>x.mid===m.id);
    const corr = av.reduce((s,x)=>s+((+x.rep||0)*th + (+x.paro||0)*cp), 0);
    return {m, prev, corr, tot:prev+corr, nAv:av.length};
  }).filter(x=>x.tot>0).sort((x,y)=>y.tot-x.tot);
}
function cumplPorMaquina(){
  return DB.maquinas.map(m => {
    const hs = DB.historial.filter(h=>h.mid===m.id);
    const ag = (m.tareas||[]).map(t=>estadoTarea(m,t));
    return {m, n:hs.length, venc: ag.filter(e=>e.st==="vencida").length,
            pct: hs.length ? Math.round(hs.filter(h=>!h.tarde).length/hs.length*100) : null};
  }).filter(x=>x.n || (x.m.tareas||[]).length);
}
function paroPorMaquina(){
  return DB.maquinas.map(m => {
    const av = DB.averias.filter(a=>a.mid===m.id);
    return {m, n:av.length, paro:av.reduce((s,a)=>s+(+a.paro||0),0), rep:av.reduce((s,a)=>s+(+a.rep||0),0)};
  }).filter(x=>x.n).sort((a,b)=>b.paro-a.paro);
}
function ultimoParte(mid){
  const hs = DB.historial.filter(h=>h.mid===mid).map(h=>parseISO(h.fecha)).filter(Boolean).sort((a,b)=>b-a);
  return hs[0] || null;
}

/* ── Gráficos ── */
function niceMax(v){
  if(!(v>0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v))), n = v/e;
  return (n<=1?1:n<=2?2:n<=5?5:10)*e;
}
function barras({labels, values, suffix="", alto=180, color="var(--s1)", entero=false}){
  const W=560, pad={l:38,r:14,t:18,b:26}, iw=W-pad.l-pad.r, ih=alto-pad.t-pad.b;
  const reales = values.filter(v=>v!=null);
  const max = niceMax(Math.max.apply(null, reales.concat([0])));
  const bw = iw/labels.length, bar = Math.min(30, bw*0.55);
  const last = values.reduce((k,v,i)=> v!=null ? i : k, -1);
  const fmt = v => entero ? nfmt(v) : nfmt(v, v%1?1:0);
  return `<svg class="chart" viewBox="0 0 ${W} ${alto}" role="img" aria-label="Serie mensual">
    ${[0,max/2,max].map(t=>{const y=pad.t+ih-(t/max)*ih;
      return `<line class="gl" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l-8}" y="${y+3.5}" text-anchor="end" class="val">${fmt(t)}${suffix}</text>`;}).join("")}
    ${values.map((v,i)=>{
      const x = pad.l+i*bw+(bw-bar)/2;
      if(v==null) return `<rect x="${x}" y="${pad.t+ih-3}" width="${bar}" height="3" rx="1.5" fill="var(--grid)"><title>${labels[i]}: sin datos</title></rect>`;
      const h=(v/max)*ih, y=pad.t+ih-h, es=i===last;
      return `<g><rect x="${x}" y="${y}" width="${bar}" height="${Math.max(h,2)}" rx="4" fill="${es?"var(--brand)":color}"><title>${labels[i]}: ${fmt(v)}${suffix}</title></rect>
        ${es&&v>0?`<text x="${x+bar/2}" y="${y-6}" text-anchor="middle" class="val" style="fill:var(--ink);font-weight:600">${fmt(v)}${suffix}</text>`:""}</g>`;
    }).join("")}
    <line class="ax" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+ih}" y2="${pad.t+ih}"/>
    ${labels.map((l,i)=>`<text x="${pad.l+i*bw+bw/2}" y="${alto-8}" text-anchor="middle">${l}</text>`).join("")}
  </svg>`;
}
function area({labels, values, suffix="", alto=180}){
  const W=560, pad={l:40,r:16,t:18,b:26}, iw=W-pad.l-pad.r, ih=alto-pad.t-pad.b;
  const max = niceMax(Math.max.apply(null, values.concat([0])));
  const X = i => pad.l+(i/Math.max(1,values.length-1))*iw, Y = v => pad.t+ih-(v/max)*ih;
  const linea = values.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const relleno = `${linea} L${X(values.length-1).toFixed(1)},${pad.t+ih} L${X(0)},${pad.t+ih} Z`;
  const ult = values[values.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${alto}" role="img" aria-label="Serie mensual">
    ${[0,max/2,max].map(t=>{const y=Y(t);
      return `<line class="gl" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l-8}" y="${y+3.5}" text-anchor="end" class="val">${nfmt(t, t%1?1:0)}</text>`;}).join("")}
    <path d="${relleno}" fill="var(--s2)" opacity=".14"/>
    <path d="${linea}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===values.length-1?5:3.4}" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>${labels[i]}: ${nfmt(v,1)} ${suffix}</title></circle>`).join("")}
    ${ult>0?`<text x="${X(values.length-1)}" y="${Y(ult)-13}" text-anchor="end" class="val" style="fill:var(--ink);font-weight:600">${nfmt(ult,1)} ${suffix}</text>`:""}
    <line class="ax" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+ih}" y2="${pad.t+ih}"/>
    ${labels.map((l,i)=>`<text x="${X(i)}" y="${alto-8}" text-anchor="middle">${l}</text>`).join("")}
  </svg>`;
}
function ranking(filas){
  const max = Math.max.apply(null, filas.map(f=>f.v).concat([0])) || 1;
  return `<div style="display:flex;flex-direction:column;gap:11px">${filas.map(f=>`
    <div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:10px">
        <span style="min-width:0"><span class="code">${esc(f.id)}</span> <span style="color:var(--ink-2)">${esc(f.nombre)}</span>${f.extra?` <span class="sub">· ${esc(f.extra)}</span>`:""}</span>
        <span class="mono" style="font-weight:600;white-space:nowrap">${esc(f.txt)}</span></div>
      <div style="height:13px;border-radius:4px;overflow:hidden;background:var(--surface-2)">
        <div style="width:${(f.v/max*100).toFixed(1)}%;height:100%;background:${f.color||"var(--s1)"}"></div></div>
    </div>`).join("")}</div>`;
}
function panelVacio(titulo, texto){
  return `<div class="emptystate" style="padding:32px 22px"><h3>${titulo}</h3><p>${texto}</p></div>`;
}

        <tbody>${DB.maquinas.map(m=>{
          const u = ultimoParte(m.id), dias = u ? diffDays(today(), u) : null;

          </tr>`;}).join("")}</tbody>
      </table></div>
    </div>

    ${hist.length?`<div class="card" style="margin-top:14px">
      <div class="hd"><h2>Actividad reciente</h2><div style="flex:1"></div><span class="sub">últimos 10 partes</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Fecha</th><th>Máquina</th><th>Intervención</th><th>Por</th><th class="num">Tiempo</th><th>Incidencias</th></tr></thead>
        <tbody>${hist.slice().sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha))).slice(0,10).map(h=>`<tr>
          <td class="mono">${esc(fmtFull(parseISO(h.fecha)))}</td>
          <td><span class="code">${esc(h.mid)}</span></td>
          <td>${esc(h.tarea)}</td>
          <td class="sub">${esc(h.por)}</td>
          <td class="num">${h.min} min</td>
          <td>${h.tarde?'<span class="pill warn"><i></i>Fuera de plazo</span>':""}${h.noConf?`<span class="pill crit" style="margin-left:5px"><i></i>${h.noConf} no conf.</span>`:""}${h.prov?'<span class="pill warn" style="margin-left:5px"><i></i>Provisional</span>':""}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`:""}

    ${RO()?"":`
    <div class="card" style="margin-top:14px">
      <div class="hd"><h2>Cuánto cuesta una hora</h2><div style="flex:1"></div><span class="sub">se rellena una vez</span></div>
      <div class="bd">
        <div class="rowsplit">
          <div style="flex:1;min-width:210px"><div class="field"><label for="aj_tarifa">Mano de obra interna (€ por hora)</label>
            <input type="number" id="aj_tarifa" data-aj="tarifaHora" value="${+a.tarifaHora||0}" min="0" step="0.5"></div></div>
          <div style="flex:1;min-width:210px"><div class="field"><label for="aj_paro">Coste de una hora de máquina parada (€)</label>
            <input type="number" id="aj_paro" data-aj="costeParoHora" value="${+a.costeParoHora||0}" min="0" step="1"></div></div>
        </div>
        <div class="note" style="margin-bottom:14px">${ICON.info}<div>El segundo es el que de verdad mueve a gerencia. No es el sueldo de nadie: es lo que deja de facturarse mientras la línea está parada. Aunque sea una estimación aproximada, ponla — sin ella, una avería de seis horas parece costar cuarenta euros.</div></div>
        <div style="display:flex"><div style="flex:1"></div><button class="btn primary" data-saveaj>Guardar</button></div>
      </div>
    </div>`}
  </div>`;
}

/* ══════════════ ALTA DE MÁQUINA ══════════════ */
const FASES = ["Identificación","Criticidad","Reglas del equipo","Horas de trabajo","Resumen"];
function altaInit(){
  state.alta = {step:0, d:{id:"", nombre:"", grupo:(DB.grupos||["Producción"])[0], ubic:"",
    resp:((DB.personas||[])[0]||{}).n||"", fab:"", modelo:"", serie:"", anio:"", doc:"",
    q1:null,q2:null,q3:null,q4:null,q5:null,
    reglas:{loto:true, vb:true, epi:"Guantes anticorte, gafas y calzado de seguridad", avisos:[]},
    horas:{tiene:false, acum:0, semana:40, act:toISO(today()), gobierno:"Ambos — lo que ocurra antes"}}};
}
function altaCrit(d){
  let s=0;
  if(d.q1===true) s+=2; if(d.q2===false) s+=2; if(d.q3===true) s+=3; if(d.q4===true) s+=2; if(d.q5===true) s+=1;
  return s>=6?"A":s>=3?"B":"C";
}
const yesno = (path,q,val,hint="") => `
  <div class="chkitem" style="margin-bottom:8px"><div class="top">
    <span class="lbl">${q}${hint?`<div class="sub" style="font-size:12.5px">${hint}</div>`:""}</span>
    <span class="seg">
      <button data-yn="${path}" data-v="si" class="${val===true?"on-sel":""}">Sí</button>
      <button data-yn="${path}" data-v="no" class="${val===false?"on-sel":""}">No</button>
    </span></div></div>`;

function viewAlta(){
  const a = state.alta, d = a.d, st = a.step;
  const A = (k,l,ph="",type="text") => `<div class="field"><label for="a_${k}">${l}</label><input type="${type}" id="a_${k}" data-a="${k}" value="${esc(d[k]||"")}" placeholder="${ph}"></div>`;
  let body = "";

  if(st===0) body = `<div class="card"><div class="bd">
      <div class="rowsplit">
        <div style="flex:1;min-width:150px">${A("id","Código de máquina","E23")}</div>
        <div style="flex:2;min-width:230px">${A("nombre","Nombre","Enfajadora de la línea 3")}</div>
      </div>
      <div class="rowsplit">
        <div style="flex:1;min-width:190px"><div class="field"><label for="a_grupo">Grupo</label>
          <select id="a_grupo" data-a="grupo">${(DB.grupos||[]).map(g=>`<option ${g===d.grupo?"selected":""}>${esc(g)}</option>`).join("")}</select></div></div>
        <div style="flex:1;min-width:190px">${A("ubic","Ubicación o línea")}</div>
        <div style="flex:1;min-width:190px"><div class="field"><label for="a_resp">Responsable del grupo</label>
          <select id="a_resp" data-a="resp">${(DB.personas||[]).map(p=>`<option ${p.n===d.resp?"selected":""}>${esc(p.n)}</option>`).join("")}</select></div></div>
      </div>
      <div class="rowsplit">
        <div style="flex:1;min-width:150px">${A("fab","Fabricante")}</div>
        <div style="flex:1;min-width:150px">${A("modelo","Modelo")}</div>
        <div style="flex:1;min-width:130px">${A("serie","Nº de serie")}</div>
        <div style="flex:1;min-width:110px">${A("anio","Año")}</div>
      </div>
      ${A("doc","Documento del plan interno","F1/P-07 Rev. 04")}
    </div></div>
    <div class="note" style="margin-top:14px">${ICON.info}<div>El código es el que irá impreso en el QR pegado en el cuadro de la máquina.</div></div>`;

  if(st===1){
    const c = altaCrit(d);
    body = `<div class="note" style="margin-bottom:14px">${ICON.info}<div>No todas las máquinas merecen el mismo plan. Responde cinco preguntas y el sistema propone la criticidad.</div></div>
    <div class="card"><div class="bd">
      ${yesno("q1","Si esta máquina para, ¿para toda la línea?",d.q1)}
      ${yesno("q2","¿Hay un equipo alternativo o forma de seguir produciendo?",d.q2)}
      ${yesno("q3","¿Un fallo puede afectar a la seguridad de las personas?",d.q3)}
      ${yesno("q4","¿Un fallo puede afectar al producto o a su calidad?",d.q4)}
      ${yesno("q5","¿El repuesto principal tarda más de dos semanas en llegar?",d.q5)}
    </div></div>
    <div class="card" style="margin-top:14px"><div class="bd" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div><p class="eyebrow">Criticidad propuesta</p><div style="font-size:34px;font-weight:600;line-height:1">${c}</div></div>
      <div style="flex:1;min-width:230px" class="sub">${
        c==="A"?"Crítica. Plan completo, repuestos en stock y prioridad máxima ante un vencimiento."
       :c==="B"?"Importante. Plan preventivo normal, repuestos por condición."
       :"Secundaria. Inspección periódica ligera."}</div>
    </div></div>`;
  }

  if(st===2){
    const r = d.reglas;
    body = `<div class="card"><div class="bd">
      <label class="checkbig ${r.loto?"on":""}" style="margin-bottom:10px"><input type="checkbox" data-ar="loto" ${r.loto?"checked":""}>
        <span class="txt"><b>Exige consignación eléctrica antes de intervenir.</b><br><span style="color:var(--ink-2)">El parte no se abre sin confirmarlo.</span></span></label>
      <label class="checkbig ${r.vb?"on":""}" style="margin-bottom:16px"><input type="checkbox" data-ar="vb" ${r.vb?"checked":""}>
        <span class="txt"><b>Exige visto bueno antes de volver a producción.</b><br><span style="color:var(--ink-2)">El parte queda pendiente hasta que lo firma el responsable.</span></span></label>
      <div class="field"><label for="ar_epi">EPI obligatorio</label><input type="text" id="ar_epi" data-ar="epi" value="${esc(r.epi)}"></div>
      <div class="field"><label for="ar_avisos">Advertencias específicas de esta máquina</label>
        <textarea id="ar_avisos" data-aravisos placeholder="Una por línea.&#10;Nunca aire comprimido — solo aspiración industrial&#10;Limpiar antes de lubricar. Grasa aprobada: SKF LGWA 2" style="min-height:104px">${esc((r.avisos||[]).join("\n"))}</textarea>
        <div class="help" style="margin-top:6px">Salen en rojo al abrir cualquier parte de esta máquina, antes de empezar.</div></div>
    </div></div>`;
  }

  if(st===3){
    const h = d.horas;
    body = `<div class="note" style="margin-bottom:14px">${ICON.info}<div>Si no hay horómetro no pasa nada: se registran las horas trabajadas cuando se sepan y el portal proyecta con la media semanal entre registros.</div></div>
    <div class="card"><div class="bd">
      <label class="checkbig ${h.tiene?"on":""}" style="margin-bottom:16px"><input type="checkbox" data-ah="tiene" ${h.tiene?"checked":""}>
        <span class="txt"><b>La máquina tiene horómetro o contador de horas.</b></span></label>
      <div class="rowsplit">
        <div style="flex:1;min-width:170px"><div class="field"><label for="ah_acum">Horas acumuladas hoy</label><input type="number" id="ah_acum" data-ah="acum" value="${+h.acum||0}"></div></div>
        <div style="flex:1;min-width:170px"><div class="field"><label for="ah_semana">Horas de trabajo por semana</label><input type="number" id="ah_semana" data-ah="semana" value="${+h.semana||0}"></div></div>
      </div>
      <div class="field"><label for="ah_gob">Gobierno del plan</label>
        <select id="ah_gob" data-ah="gobierno">${["Ambos — lo que ocurra antes","Solo calendario","Solo horas de trabajo"].map(o=>`<option ${o===h.gobierno?"selected":""}>${esc(o)}</option>`).join("")}</select>
        <div class="help" style="margin-top:6px">«Lo que ocurra antes» evita que una máquina parada acumule óxido sin revisión y que una intensiva llegue tarde.</div></div>
    </div></div>`;
  }

  if(st===4) body = `<div class="card"><div class="hd"><h2>Resumen</h2></div><div class="bd">
      <div class="summary">
        <div><span>Máquina</span><span>${esc(d.id||"—")} · ${esc(d.nombre||"sin nombre")}</span></div>
        <div><span>Grupo y responsable</span><span>${esc(d.grupo)} · ${esc(d.resp)}</span></div>
        <div><span>Criticidad</span><span>${altaCrit(d)}</span></div>
        <div><span>Consignación / visto bueno</span><span>${d.reglas.loto?"Sí":"No"} / ${d.reglas.vb?"Sí":"No"}</span></div>
        <div><span>Avisos definidos</span><span>${(d.reglas.avisos||[]).length}</span></div>
        <div><span>Gobierno del plan</span><span>${esc(d.horas.gobierno)}</span></div>
      </div>
      <div class="note" style="margin-top:16px">${ICON.info}<div>Al crearla entrarás directamente a su plan para añadir las tareas. Sin tareas, la máquina no genera nada en la pantalla del mecánico.</div></div>
    </div></div>`;

  const ok = st!==0 || (d.id && d.nombre);
  return `<div class="wrap">
    <div class="pagehead"><div>
      <button class="btn ghost" data-nav="maquinas" style="margin-bottom:8px;padding:4px 8px">← Máquinas</button>
      <p class="eyebrow">Alta de máquina · fase ${st+1} de ${FASES.length}</p><h1>${FASES[st]}</h1>
    </div></div>
    <div class="tabs" role="tablist" style="margin-bottom:18px">${FASES.map((f,i)=>`<button role="tab" aria-selected="${i===st}" data-fase="${i}">${i+1}. ${f}</button>`).join("")}</div>
    ${body}
    <div style="display:flex;gap:10px;margin-top:20px;align-items:center">
      ${st>0?`<button class="btn" data-fase="${st-1}">Atrás</button>`:""}
      <div style="flex:1"></div>
      ${st<FASES.length-1 ? `<button class="btn primary" data-fase="${st+1}" ${ok?"":"disabled"}>Continuar</button>`
                          : `<button class="btn primary" data-altafin>Crear máquina</button>`}
    </div>
  </div>`;
}

function sheetShell(title, sub, stepsHtml, content, footer, extra=""){

      <header>
        <div style="min-width:0"><p class="eyebrow">${sub}</p><h2 style="font-size:17px">${esc(title)}</h2></div>

      </header>
      ${stepsHtml}<div class="content">${content}</div><footer>${footer}</footer>

}

  const seq = String(DB.averias.filter(a=>String(a.id).startsWith(n)).length+1).padStart(2,"0");
  return sheetShell("Solicitud de reparación", `Formato Ver. 1.0 · nº de parte ${n+seq}`, "", `
    <div class="summary" style="margin-bottom:16px">
      <div><span>Fecha</span><span class="mono">${esc(fmtFull(d))}</span></div>
      <div><span>Nº de parte</span><span class="mono">${n+seq}</span></div>
    </div>
    <div class="rowsplit">
      <div class="field" style="flex:2;min-width:200px"><label for="am">Máquina</label>
        <select id="am">${DB.maquinas.map(m=>`<option value="${esc(m.id)}">${esc(m.id)} — ${esc(m.nombre)}</option>`).join("")}</select></div>
      <div class="field" style="flex:1;min-width:180px"><label for="asol">Solicitante</label>
        <select id="asol">${(DB.personas||[]).map(p=>`<option>${esc(p.n)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="ad">Descripción</label><textarea id="ad" placeholder="Qué ha pasado, con tus palabras"></textarea></div>
    <div class="field"><label for="ac">Consecuencia</label><textarea id="ac" placeholder="¿La máquina está parada? ¿Desde cuándo? ¿Puede seguir funcionando y con qué riesgo?"></textarea>
      <div class="help" style="margin-top:6px">Es el campo con más valor: distingue una máquina parada de una que aguanta bajo riesgo.</div></div>
    <div class="rowsplit">
      <div class="field" style="flex:1;min-width:150px"><label for="ap">Horas de máquina parada</label><input type="number" id="ap" step="0.25" value="0"></div>
      <div class="field" style="flex:1;min-width:150px"><label for="ar">Horas de reparación</label><input type="number" id="ar" step="0.25" value="0"></div>
    </div>
  `, `<button class="btn ghost" data-close>Cancelar</button><div class="spacer"></div><button class="btn primary" data-doav>Registrar solicitud</button>`);
}

/* ── Visto bueno ── */
